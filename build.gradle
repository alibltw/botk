plugins {
    id 'java'
}

group 'com.botplus'
version '2.6.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://jitpack.io' }
}

dependencies {
    compileOnly 'com.github.DarkBot-reloaded:DarkBotAPI:master-SNAPSHOT'
    // DarkBot'un kendisi: sadece derleme icin (modul listesi ve ayar kaydi). Jar'a girmez.
    compileOnly('eu.darkbot:DarkBot:66ae03e7ca') { transitive = false }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    archiveFileName.set("BotPlus.jar")
}