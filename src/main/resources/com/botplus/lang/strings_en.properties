# suppress inspection "UnusedProperty" for whole file
botplus=BotPlus

botplus.enabled=BotPlus Enabled
botplus.enabled.desc=When off, BotPlus does nothing (when selected as module, the DarkBot fallback drives the ship).

botplus.sort=Priority
botplus.sort.desc=Only with Module Mode "NPC + Boxes": which comes first when NPCs and boxes are both around.
botplus.sort.module=Bot Module
botplus.sort.module.desc=The selected DarkBot module's own order (Loot & Collect: NPC first).
botplus.sort.npc_first=NPC first, then boxes
botplus.sort.npc_first.desc=No boxes while there is an NPC or a locator signal; after a kill its box and nearby boxes, without NPCs boxes within range.
botplus.sort.box_first=Boxes first, then NPC
botplus.sort.box_first.desc=Boxes nearby first; boxes in collect range are also taken during the fight.
botplus.sort.table=By table priority
botplus.sort.table.desc=Lower priority number in the NPC and box tables first.
botplus.order=Priority
botplus.order.npc_first=NPC first, then boxes
botplus.order.npc_first.desc=No boxes while there is an NPC or a locator signal; after a kill its box and nearby boxes are taken.
botplus.order.box_first=Boxes first, then NPC
botplus.order.box_first.desc=Boxes nearby first; boxes in collect range are also taken during the fight.
botplus.order.table=By table priority
botplus.order.table.desc=Lower priority number in the NPC and box tables first.

botplus.box_way=Boxes On The Way To NPC
botplus.box_way.desc=Whether to turn to boxes while going to an NPC or locator signal.
botplus.box_way.ignore=Ignore
botplus.box_way.ignore.desc=No boxes while going to an NPC; while an NPC is visible "boxes when no NPC" is off too.
botplus.box_way.on_route=Take On Route
botplus.box_way.on_route.desc=Boxes within 300 of the route are taken (no turning back).
botplus.box_way.nearby=Take Nearby
botplus.box_way.nearby.desc=Boxes within collect range are taken, then on to the NPC.

botplus.avoid_unlisted=Avoid Unlisted NPCs On The Way
botplus.avoid_unlisted.desc=Going to an NPC, signal or roam point, NPCs not in the kill list within 700 of the route are bypassed. The target does not change.

botplus.avoid_near=No Avoiding Near Target
botplus.avoid_near.desc=Within 1500 of the target NPC or locator signal unlisted NPCs are not bypassed, the ship goes straight; the attack config is used from there.

botplus.box_max_dist=Max Box Distance
botplus.box_max_dist.desc=Boxes farther than this are not chased.

botplus.locator=Locator
botplus.locator.desc=PET locator and attacked NPC settings.
botplus.locator.go=Go When Located
botplus.locator.go.desc=Goes straight to the NPC the locator shows.
botplus.locator.direct=Go Direct To Enemy Locator
botplus.locator.direct.desc=With Enemy Locator on, the bot always goes to the NPC the locator shows. When this is on, boxes and other NPCs on the way are ignored and it does not shoot while passing.
botplus.locator.drop=Drop NPC
botplus.locator.drop.desc=Drops the current NPC and goes to the located one.
botplus.locator.drop_hp=Drop Health (%)
botplus.locator.drop_hp.desc=If the current NPC is below this, it is finished first.

botplus.pet=PET
botplus.pet.desc=General PET settings. The attack PET is in Combat, the steal PET in NPC Steal, the travel enemy locator in Enemy Locator.
botplus.pet.enabled=Let BotPlus Manage PET
botplus.pet.enabled.desc=When off BotPlus never changes the PET gear; DarkBot's PET setting is used.
botplus.pet.combat_change=Change PET When Attacking NPC
botplus.pet.combat_change.desc=When off the PET is not touched in combat (DarkBot's PET setting).
botplus.pet.combat=Attack PET Gear
botplus.pet.combat.desc=With Change PET In Combat on, the PET switches to this gear near an NPC. After a kill with no NPC nearby it goes straight to the locator.
botplus.pet.combat.looter=Auto-looter
botplus.pet.combat.guard=Guard
botplus.pet.combat.kamikaze=Kamikaze
botplus.pet.combat.combo_repair=Combo Repair
botplus.pet.travel_locator=Enemy Locator On The Way
botplus.pet.travel_locator.desc=PET uses the enemy locator while searching and going to a signal (with Enemy Locator on).
botplus.pet.repair=Repair PET While Repairing
botplus.pet.repair.desc=PET uses its own repair gear while repairing and HP waiting (else guard). It does not repair the ship; see PET Ship Repair in the Repair sub-module.
botplus.pet.low_repair=Repair PET When Its HP Is Low
botplus.pet.low_repair.desc=Out of combat (no target, nobody shooting) the PET switches to its own repair gear when its HP drops below the limit and repairs up to 70%. Stops if a fight starts.
botplus.pet.low_hp=PET HP Limit (%)
botplus.pet.low_hp.desc=PET repair starts below this HP.
botplus.pet.refresh_min=Refresh If PET Stays Off (min)
botplus.pet.refresh_min.desc=If the PET cannot be launched for this many minutes, the game is refreshed (with BotPlus Refresh if enabled, otherwise with DarkBot). 0: off.

botplus.protect=Protection
botplus.protect.desc=EMP, Insta-Shield and PET HP Link: each has its own When selection and HP limit. Selected conditions must all hold (HP below limit + attacker). With nothing selected it is used while HP drops below the limit. Missing or not-ready items are skipped.
botplus.protect.enabled=Enable Ship Protection
botplus.protect.emp.enabled=Use EMP
botplus.protect.emp.enabled.desc=Breaks locks on you. Not used unless an enemy player is shooting you (not wasted on NPC locks).
botplus.protect.emp.when=EMP When
botplus.protect.emp.hp=EMP HP Limit (%)
botplus.protect.emp.hp.desc=With "HP below limit" selected, used only below this HP.
botplus.protect.ish.enabled=Use Insta-Shield
botplus.protect.ish.enabled.desc=No damage for a short time.
botplus.protect.ish.when=Insta-Shield When
botplus.protect.when=When
botplus.protect.when.enemy=While a player attacks
botplus.protect.when.npc=While an NPC attacks
botplus.protect.when.hp_low=HP below limit
botplus.protect.when.hp_low.desc=HP is below the item's limit. Alone: used while HP is dropping (taking damage); with an attacker selected both are required.
botplus.protect.ish.hp=Insta-Shield HP Limit (%)
botplus.protect.ish.hp.desc=With "HP below limit" selected, used only below this HP.
botplus.protect.hp_link=PET HP Link
botplus.protect.hp_link.desc=Transfers the PET's HP to the ship: damage to the ship goes to the PET for 20 s (cooldown 240 s). The PET stays in HP Link gear meanwhile.
botplus.protect.hp_link.enabled=Use HP Link
botplus.protect.hp_link.when=When
botplus.protect.hp_link.hp=HP Link HP Limit (%)
botplus.protect.emp=EMP
botplus.protect.ish=Insta-Shield
botplus.protect.item.on=Use
botplus.protect.item.hp=HP Limit (%)
botplus.protect.item.hp.desc=With "HP below limit" selected, used only below this HP.

botplus.locator.ignore=Ignore Attacked NPC
botplus.locator.rotate=Rotate Locator Type
botplus.locator.rotate.desc=If the locator gives no signal for 20 seconds that NPC type is skipped for 90 seconds and the next type in the table is searched (PET module Enemy Locator).
botplus.locator.ignore.desc=An NPC attacked by others is ignored for 60 seconds.
botplus.locator.evade_guard=Guard PET While Moving Away
botplus.locator.evade_guard.desc=PET uses guard gear while moving away from an ignored NPC (with Let BotPlus Manage PET on).

botplus.steal=Steal NPC
botplus.steal.enabled=Enabled
botplus.steal.which=Which NPCs
botplus.steal.which.desc=Which NPCs attacked by others are stolen.
botplus.steal.which.flagged=NS flagged
botplus.steal.which.all=All NPCs to kill
botplus.steal.desc=NPCs to steal are selected in the NS column of the NPC table.
botplus.steal.from=From
botplus.steal.from.enemy=Enemies Only
botplus.steal.from.all=Everyone (except friends)
botplus.steal.npc_hp=NPC Health Min (%)
botplus.steal.npc_hp.desc=Gives up if the NPC is below this.
botplus.steal.action=Enemy
botplus.steal.action.kill=Kill
botplus.steal.action.reduce=Reduce Health
botplus.steal.enemy_hp=Enemy Health (%)
botplus.steal.enemy_hp.desc=With "Reduce Health", the enemy is left at this value.
botplus.steal.chase_sec=Chase Time (seconds)
botplus.steal.chase_sec.desc=Returns to the NPC when time is up.
botplus.steal.hero_hp=Ship Health Min (%)
botplus.steal.hero_hp.desc=Stops attacking if your health drops below this.
botplus.steal.ammo=Ammo
botplus.steal.ammo.desc=Ammo used on the enemy.
botplus.steal.ammo.x1=x1 (LCB-10)
botplus.steal.ammo.x2=x2 (MCB-25)
botplus.steal.ammo.x3=x3 (MCB-50)
botplus.steal.ammo.x4=x4 (UCB-100)
botplus.steal.ammo.sab=SAB-50
botplus.steal.ammo.rsb=RSB-75
botplus.steal.ammo.cbo=CBO-100
botplus.steal.ammo.a_bl=A-BL
botplus.steal.pet=PET Gear While Stealing
botplus.steal.pet.desc=PET switches to this gear while stealing (with Let BotPlus Manage PET on).
botplus.steal.pet.none=Don't change
botplus.steal.pet.guard=Guard
botplus.steal.pet.kamikaze=Kamikaze
botplus.steal.pet.combo_guard=Combo Guard


botplus.chase.enabled=Chase Fleeing NPC
botplus.chase.enabled.desc=When an NPC flees, range is reduced by the rate below and the ship approaches from the side (max 40 s).
botplus.chase.drop=Range Drop (%)
botplus.chase.drop.desc=Chase distance = the NPC's table range minus this much.

botplus.combat.options=Options
botplus.combat.options.desc=Options for all attack styles.
botplus.combat.options.inward=Step In Now And Then
botplus.combat.options.inward.desc=Every second pass moves slightly inward (10% of range). Turn on with many "out of range".
botplus.combat.options.out_on_damage=Leave Range When Taking Damage
botplus.combat.options.out_on_damage.desc=While the NPC hits (HP + shield below 90% and dropping faster than 1.5%/s), every 7 s step out of its reach for 1.5 s, then back in. Shield counts too.
botplus.combat.options.pre_lock=Pre-Attack
botplus.combat.options.pre_lock.desc=Locks and fires before reaching range; damage starts as soon as the lasers reach.

botplus.repair=Repair
botplus.repair.enabled=Enabled
botplus.repair.enabled.desc=Repairs when HP drops below Repair Start HP. No attacks until done.
botplus.repair.place=Repair Place
botplus.repair.place.desc=On map: BotPlus repairs where it is. At portal: goes to a portal to repair (DarkBot's escape system). Leave to DarkBot: BotPlus does not touch repairing.
botplus.repair.place.map=On map (BotPlus)
botplus.repair.place.portal=At portal (BotPlus)
botplus.repair.place.darkbot=Leave to DarkBot
botplus.repair.start_hp=Repair Start Health (%)
botplus.repair.end_hp=Repair End Health (%)
botplus.repair.mode=Repair Config
botplus.repair.avoid=Avoid While Repairing
botplus.repair.avoid.desc=Kept away from while repairing (NPC 1500, enemy 3000).
botplus.repair.avoid.npc=Stay away from NPCs
botplus.repair.avoid.enemy=Stay away from enemies
botplus.repair.enemy_run_mode=Run Config From Enemy
botplus.repair.near_npc=Repair Near NPC Area
botplus.repair.near_npc.desc=The repair spot is chosen just outside the NPC distance, on the side of the NPCs (or the locator signal), to return to killing right after repairing.
botplus.repair.pet_ship=PET Ship Repair While Repairing
botplus.repair.pet_ship.desc=The PET's Combo Ship Repair gear repairs the ship (if on cooldown, PET repair is used).
botplus.repair.idle=Repair When Not Taking Damage
botplus.repair.idle.desc=Repairs when HP drops below the limit below. With the Combat sub-module the ship does not stop: while roaming / going to the locator it uses the repair config and PET Combo Ship Repair and keeps away from unlisted NPCs; listed NPCs are attacked. Without Combat it stops and repairs when there is no target or signal.
botplus.repair.idle_hp=Idle Repair HP Limit (%)
botplus.repair.idle_hp.desc=Idle repair starts below this HP and lasts until Repair End HP.
botplus.repair.enemy_run_mode.desc=Uses the run config while moving away from an enemy player.

botplus.renew=Refresh
botplus.renew.desc=Timing comes from DarkBot's refresh setting.
botplus.renew.enabled=Enabled
botplus.renew.mode=Refresh Mode
botplus.renew.mode.map=Refresh On Map
botplus.renew.mode.portal=Refresh At Portal
botplus.renew.mode.logout=Log Out And Refresh

botplus.combat=Combat
botplus.combat.desc=When enabled BotPlus takes full control on the working map: target selection (DarkBot's wrong-NPC rules kept), fighting, box collecting and roaming. The ship is not handed to DarkBot. Distances come from the NPC table range.
botplus.combat.enabled=Enabled
botplus.combat.enabled.desc=Full control: direct approach, tangent arc entry, reading where the NPC goes, box after death and no-stop switching to the next NPC.
botplus.combat.style=Attack Style
botplus.combat.style.desc=How to move around the NPC. The first hit is always taken by going straight to the NPC. Each style has its own settings group.
botplus.combat.style.arc=Arc
botplus.combat.style.arc.desc=Arc of the Turn Angle on the safe side; reverses at the ends.
botplus.combat.style.circle=Full Circle
botplus.combat.style.circle.desc=Full circle around the NPC like DarkBot (range from the table).
botplus.combat.style.hold=Hold
botplus.combat.style.hold.desc=Stay in range without circling (follows if the NPC moves).
botplus.combat.style.safe=Safe Angle
botplus.combat.style.safe.desc=Stay on the side where the NPC deals the least damage (selected or learned). Arc until learned.
botplus.combat.style.outrange=Outrange
botplus.combat.style.outrange.desc=Stay outside the NPC's hit distance but within laser range. Arc if the NPC reaches that far.
botplus.combat.pet=PET While Attacking NPCs
botplus.combat.pet.desc=The PET switches to this gear near an NPC. Don't change: the PET is not touched, DarkBot's PET setting applies. Repair, HP Link and moving away come first.
botplus.combat.pet.none=Don't change (DarkBot's PET setting)
botplus.combat.pet.looter=Auto-looter
botplus.combat.pet.guard=Guard
botplus.combat.pet.kamikaze=Kamikaze
botplus.combat.pet.combo_repair=Combo Repair
botplus.combat.pet.combo_guard=Combo Guard
botplus.combat.arc_set=Arc Settings
botplus.combat.arc_set.desc=Only with Fight Style "Arc".
botplus.combat.arc_angle=Turn Angle (degrees)
botplus.combat.arc_angle.desc=Width of the arc.
botplus.combat.safe_set=Safe Angle Settings
botplus.combat.safe_set.desc=Only with Fight Style "Safe Angle".
botplus.combat.safe_side=Safe Side
botplus.combat.safe_side.desc=Which side of the NPC to stay on. Auto: BotPlus finds the side with the least damage.
botplus.combat.safe_side.auto=Auto
botplus.combat.safe_side.up_right=Up Right
botplus.combat.safe_side.right=Right
botplus.combat.safe_side.down_right=Down Right
botplus.combat.safe_side.down=Down
botplus.combat.safe_side.down_left=Down Left
botplus.combat.safe_side.left=Left
botplus.combat.safe_side.up_left=Up Left
botplus.combat.safe_side.up=Up
botplus.combat.safe_learn=Learn Best Angle
botplus.combat.safe_learn.desc=When a clear difference is found the Safe Side setting is switched to the learned side (learns per session).
botplus.combat.safe_lock=Keep Angle
botplus.combat.safe_lock.desc=The selected side is locked; measuring and logging continue but the selection does not change.
botplus.combat.safe_approach=Approach From Safe Side
botplus.combat.safe_approach.desc=Approach the NPC from the safe side instead of straight.
botplus.combat.safe_exit=Leave Angle On Damage
botplus.combat.safe_exit.desc=If much more damage than expected is taken on the safe side (3 s), use the normal arc for this NPC.
botplus.combat.out_set=Outrange Settings
botplus.combat.out_set.desc=Only with Fight Style "Outrange".
botplus.combat.out_margin=Margin
botplus.combat.out_margin.desc=How far outside the NPC's farthest hit distance to stay.
botplus.combat.finish_first=Finish First, Then Repair
botplus.combat.finish_first.desc=If the NPC will die well before the ship, repair waits until it is dead. Not delayed below 25% ship HP, when another NPC is also shooting, or with an enemy nearby.

botplus.plus=Extra Features


botplus.plus.target=Target and Range
botplus.plus.target.desc=Nearest NPC, next target, fast lock and range learning.

botplus.plus.other=Boxes, Roaming and Other
botplus.plus.other.desc=Box wait, rival, roaming, speed ability, unstuck, stats. (Captcha guard is always on.)

botplus.plus.nearest=Nearest NPC
botplus.plus.nearest.desc=Picks the nearest NPC among same priority.

botplus.plus.short_roam=Short Roaming
botplus.plus.short_roam.desc=Roams at most 2000 units away when there are no NPCs.

botplus.plus.box_wait=Wait For Box
botplus.plus.box_wait.desc=Waits 1 second for the box when the NPC dies. When off it does not wait; only visible boxes are taken.

botplus.plus.rival=Avoid Rival Collectors
botplus.plus.rival.desc=Skips boxes another ship reaches first or in the direction of a ship following you.

botplus.plus.next_target=Prepare Next Target
botplus.plus.next_target.desc=Moves toward the next NPC when the target is below 10%.

botplus.plus.auto_range=Auto Range
botplus.plus.auto_range.desc=Increases the range of NPCs that hit you while the ship stays at table range (the laser limit the game reports as "out of range" is not exceeded). Never above 110% of the table's original value. BotPlus keeps the original values, so ranges do not drift; use "Restore Original Ranges" to put them back. A value you edit by hand becomes the new original.

botplus.plus.range_down=Lower Range If Not Hitting
botplus.plus.range_down.desc=Lowers the range if no damage is dealt for 1 minute or the game says "out of range" while in range (also with Auto Range off). Never below 90% of the original table range; the original value is kept.

botplus.plus.no_learn_flee=No Range From Fleeing NPC
botplus.plus.no_learn_flee.desc=Range is not learned while the NPC flees; hit counter is reset when fleeing starts.

botplus.plus.hp_wait=HP Wait
botplus.plus.hp_wait.desc=Below the HP limit no new NPC is attacked. Not when an NPC is shooting you.
botplus.plus.hp_wait.enabled=Enabled
botplus.plus.hp_wait.which=Which NPCs
botplus.plus.hp_wait.which.flagged=HB flagged
botplus.plus.hp_wait.which.all=All NPCs
botplus.plus.hp_wait.hp=HP Limit (%)
botplus.plus.hp_wait.mode=While Waiting
botplus.plus.hp_wait.mode.desc=Wait Near NPC: the NPC stays targeted, HP is refilled within sight of it. Keep Roaming: no new NPC, roaming / locator continues (with Combat Full Control on).
botplus.plus.hp_wait.mode.near=Wait Near NPC
botplus.plus.hp_wait.mode.roam=Keep Roaming

botplus.plus.unstuck=Unstuck
botplus.plus.unstuck.desc=Forces the ship to move if it stands still for 15 seconds.

botplus.plus.fast_lock=Fast Lock
botplus.plus.fast_lock.desc=Locks the next NPC as soon as the target dies.

botplus.plus.weak_first=Weak NPC First
botplus.plus.weak_first.desc=Once the fight with the target has started, a listed NPC in laser range with less than half of the target's current HP is killed first, then back to the target. Several: table priority. Off: the target is never dropped (only for a higher priority NPC).

botplus.plus.stats=Efficiency Counter
botplus.plus.stats.desc=Shows NPC/hour and box/hour, logs a summary every 5 minutes.

botplus.plus.speed_ability=Speed Ability On Long Trips
botplus.plus.speed_ability.desc=On trips longer than 3000 (locator, far NPC, roaming) the ship speed ability is used when ready.

botplus.plus.smart_roam=Smart Roaming
botplus.plus.smart_roam.desc=Without NPCs the map is split into squares the size of the PET radar range; the nearest square not seen in the last 75 s is visited (with Combat on). Off: random square.

botplus.plus.radar=PET Radar Range
botplus.plus.radar.desc=How far the locator sees. Roaming points are not chosen closer to the map edge than this (the radar already sees the edge); square size for smart roaming.

botplus.log=Log Enabled
botplus.log.desc=Writes actions to the log for testing.

botplus.log_level=Log Level
botplus.log_level.normal=Normal
botplus.log_level.normal.desc=Only decisions and changes.
botplus.log_level.detailed=Detailed
botplus.log_level.detailed.desc=Also a status line every 5 s: target, distances, range, nearest NPC / enemy, box, cargo.

botplus.log_file=Write botplus.log
botplus.log_file.desc=Writes the log and game messages to logs/botplus.log.

botplus.flag.steal=Steal NPC
botplus.flag.steal.short=NS
botplus.flag.steal.desc=Steal this NPC when others attack it (BotPlus).
botplus.flag.wait_ability=Wait Ability
botplus.flag.wait_ability.short=YB
botplus.flag.wait_ability.desc=Do not attack until the ship ability is ready (BotPlus).
botplus.flag.wait_hp=Wait HP
botplus.flag.wait_hp.short=HB
botplus.flag.wait_hp.desc=With Repair → Wait For HP on and "HB flagged" selected: no NPC is engaged until HP reaches the limit. Still attacks if the NPC shoots.

botplus.avoid_ahead=Avoid Look-Ahead
botplus.avoid_ahead.desc=Only unlisted NPCs this far ahead on the route are bypassed (farther ones are ignored until closer).

botplus.avoid_angle=Max Detour Angle (degrees)
botplus.avoid_angle.desc=The bypass point never turns away from the target more than this; if no side fits, the ship goes straight.

botplus.avoid_aggressive=Avoid Only Aggressive NPCs
botplus.avoid_aggressive.desc=Bypass only unlisted NPCs that attack / aim at you or are not marked passive in the NPC table.

botplus.locator.dead_r=Killed NPC Spot Radius
botplus.locator.dead_r.desc=After a kill, locator marks within this distance of the kill spot are treated as the old mark.
botplus.locator.dead_sec=Killed NPC Spot Time (s)
botplus.locator.dead_sec.desc=How long the old mark at the kill spot is ignored. Cleared early if a killable NPC is seen there or the mark moves away.

botplus.empty=Empty Map Mode
botplus.empty.desc=When the locator shows no signal (no NPC of the hunted type alive), roaming moves to the map centre instead of the map edges, so the way to the next spawn is short. Needs Go When Located.
botplus.empty.enabled=Enabled
botplus.empty.enabled.desc=Roam near the map centre while the locator has no signal.
botplus.empty.sec=No Signal Time (s)
botplus.empty.sec.desc=Empty map mode starts after the locator has shown no signal for this long.

botplus.repair.travel_roam=Fast Formation On Long Trips
botplus.repair.travel_roam.desc=During idle repair the roam config/formation is used on trips longer than 3000 (repair config when stopped or near).
botplus.repair.desc=Repair config and start / end HP come from DarkBot's repair settings (General → Safety → Repair).
botplus.repair.idle_set=Idle Repair

botplus.combat.fight_min_hp=Min HP To Start New Fight (%)
botplus.combat.fight_min_hp.desc=A new NPC is not started below this HP unless something is shooting you (0: off). A started fight is not dropped.
botplus.combat.full=Full Control
botplus.combat.full.desc=On: BotPlus runs the fight (attack style, arc, range). Off: DarkBot's logic fights; the target and range settings below help it.
botplus.combat.flee=Fleeing NPC
botplus.combat.target=Target
botplus.combat.range=Range

botplus.pet.combat.combo_guard=Combo Guard

botplus.rsb=RSB Ammo
botplus.rsb.desc=BotPlus RSB without a key: ammo is picked from the list. DarkBot's own RSB is blocked while BotPlus attacks. The first shot is always normal ammo; if firing stalls after switching to RSB, normal ammo is used at once.
botplus.rsb.enabled=Enabled
botplus.rsb.which=Which NPCs
botplus.rsb.which.flagged=RSB flagged NPCs
botplus.rsb.which.all=All NPCs
botplus.rsb.ammo=RSB Ammo
botplus.rsb.ping=Ping Limit (ms)
botplus.rsb.ping.desc=No RSB while ping is above this.
botplus.rsb.lag_guard=Lag Guard
botplus.rsb.lag_guard.desc=If firing does not continue after switching to RSB, back to normal ammo; 2 failures in 30 s turn RSB off for 20 s.

botplus.flag.rsb=Use RSB (BotPlus)
botplus.flag.rsb.short=RSB
botplus.flag.rsb.desc=Use RSB on this NPC (BotPlus RSB, "RSB flagged").

botplus.locator.refresh=Refresh Enemy Locator After NPC Dies
botplus.locator.refresh.desc=After a kill the PET briefly goes passive and returns to the enemy locator, so the new mark may come sooner than the old mark at the kill spot (experimental). Only after 4 s out of combat.
botplus.locator.go_set=Go To Signal
botplus.locator.attacked=Attacked NPC
botplus.locator.empty=Empty Map Mode
botplus.locator.empty.desc=When the locator shows no signal for 6 seconds (no NPC of the hunted type alive), roaming moves to the map centre instead of the edges.

botplus.work=Module Mode
botplus.work.desc=A strict rule like DarkBot's modules: Boxes only never goes to NPCs, NPC only never collects boxes (even if sub-module settings are on). If a DarkBot module is selected, that module decides.
botplus.work.npc=NPC only
botplus.work.box=Collect only
botplus.work.npc_box=NPC + Collect

botplus.general=General

botplus.move=Movement

botplus.roam=Roaming

botplus.box=Boxes

botplus.log_set=Log

botplus.defense.enabled=Enabled
botplus.defense.enabled.desc=Even with the plugin feature on, Defense does nothing while this is off (EMP, Insta-Shield, HP Link). What to do when an enemy attacks and Remember Enemy are in the BotPlus menu under "On Enemy Attack".
botplus.defense.rsb_players=Use RSB On Players
botplus.defense.rsb_players.desc=While shooting a player (NPC Steal), RSB is used if the RSB sub-module is on.

botplus.flag=BotPlus

botplus.on_enemy=On Enemy Attack
botplus.on_enemy.desc=What to do when an enemy player shoots you. Only when BotPlus is selected as the module; then it replaces DarkBot's "run from enemies" settings. With a DarkBot module selected, DarkBot's own settings handle escaping (sub-modules like Combat, RSB and Defense still run).
botplus.on_enemy.mode=Action
botplus.on_enemy.mode.continue=Continue
botplus.on_enemy.mode.continue.desc=Keeps killing NPCs. When HP drops, Repair (or DarkBot's repair setting) decides.
botplus.on_enemy.mode.escape=Escape
botplus.on_enemy.mode.escape.desc=Run to the nearest safe portal and come back when the attack stops. Without a portal, outrun on the map.
botplus.on_enemy.mode.outrun=Outrun
botplus.on_enemy.mode.outrun.desc=Runs away from the enemy on the map (speed ability is used). If the enemy is faster or closing (Portal If Enemy Is Fast), escapes to a portal.
botplus.on_enemy.hp=Escape HP (%)
botplus.on_enemy.hp.desc=While an enemy is shooting, escape to a portal below this HP (also with Continue). 0: never escape because of HP. 100: escape on the first shot.
botplus.on_enemy.escape_opts=Escape Options
botplus.on_enemy.escape_opts.desc=Which portal to pick when escaping. Portals whose jump condition is off ("Never", "Repairing") are never picked.
botplus.on_enemy.escape_opts.cone=Escape Cone
botplus.on_enemy.escape_opts.cone.desc=Only portals on the side away from the enemy (±60°). Never runs to a portal on the enemy's side.
botplus.on_enemy.escape_opts.race=Arrival Race
botplus.on_enemy.escape_opts.race.desc=Skips portals the enemy would reach before you (compares both speeds).
botplus.on_enemy.escape_opts.switch_portal=Switch Portal
botplus.on_enemy.escape_opts.switch_portal.desc=If the jump is refused (game says you can't escape, or no jump for 2.5 s) it doesn't wait: goes to another portal at once. If every portal on the map is closed, it outruns.
botplus.on_enemy.escape_opts.pass_jump=Jump While Passing
botplus.on_enemy.escape_opts.pass_jump.desc=Doesn't wait on the portal: the ship keeps passing over it and tries to jump on every pass (~1 s). If the game says "in combat", it leaves the shooting NPC's range and returns when damage stops. Works for enemy and repair escapes.
botplus.on_enemy.escape_opts.else_outrun=Outrun If No Portal
botplus.on_enemy.escape_opts.else_outrun.desc=If no portal fits these rules it doesn't force a portal: it runs away on the map. When off, goes to the nearest jumpable portal ignoring cone / race.
botplus.on_enemy.outrun=Outrun Settings
botplus.on_enemy.outrun_opts=Outrun Options
botplus.on_enemy.outrun_opts.desc=How the direction is picked when running away on the map.
botplus.on_enemy.outrun_opts.reverse=Run Straight Away
botplus.on_enemy.outrun_opts.reverse.desc=Runs exactly away from the enemy (±15°). The direction is chosen once and locked; renewed only if the enemy moves while shooting. If blocked, runs to a side (45–90°); if that side hits the map edge, switches to the other side. Never towards the enemy.
botplus.on_enemy.outrun_opts.anti_cut=Cross Shield
botplus.on_enemy.outrun_opts.anti_cut.desc=Avoids points the enemy could reach first, so it can't cut across and catch up.
botplus.on_enemy.outrun_opts.edge_slide=Slide Along Edge
botplus.on_enemy.outrun_opts.edge_slide.desc=Near the map edge it doesn't stop: slides along the edge away from the enemy.
botplus.on_enemy.outrun_opts.emp_turn=EMP Turn
botplus.on_enemy.outrun_opts.emp_turn.desc=If an EMP was used during the escape (Defense), the ship turns sharply 70–90° once as the enemy's lock breaks.
botplus.on_enemy.outrun_opts.portal_hop=Jump Portal While Escaping
botplus.on_enemy.outrun_opts.portal_hop.desc=While outrunning, if a jumpable portal reached before the enemy lies within 2500 in the escape direction (max 30° off), the path goes over it and it jumps while passing without stopping. If refused (combat) it keeps outrunning.
botplus.on_enemy.outrun_opts.late_speed=Speed Ability When Close
botplus.on_enemy.outrun_opts.late_speed.desc=The speed ability (speed-type Ship Ability in Defense or the ship's speed ability) is used not at the start but when the enemy gets within 600 and keeps closing.
botplus.on_enemy.outrun_opts.side_pass=Pass Sideways When Cornered
botplus.on_enemy.outrun_opts.side_pass.desc=If no escape path is left at a corner or edge (and we are faster), passes the enemy at 1100+ distance into the open area behind it.
botplus.on_enemy.outrun.dist=Outrun Distance
botplus.on_enemy.outrun.dist.desc=Outrunning ends at this distance from the enemy.
botplus.on_enemy.outrun.calm=Calm Time (s)
botplus.on_enemy.outrun.calm.desc=Back to work once the enemy has not shot for this long.
botplus.on_enemy.outrun.faster=Portal If Enemy Is Faster
botplus.on_enemy.outrun.faster.desc=A faster enemy cannot be outrun: escape straight to a portal.
botplus.on_enemy.outrun.emp=EMP While Outrunning
botplus.on_enemy.outrun.emp.desc=If the enemy still has you locked after running the distance below, EMP is used to break the lock and you keep running away from the enemy. Also tried before switching to a portal when the enemy is faster / closing in. Only the enemy's lock counts; if your own lock is stuck it is released first.
botplus.on_enemy.outrun.emp_dist=Run Distance Before EMP
botplus.on_enemy.outrun.emp_dist.desc=EMP is used once you have run this far and the enemy still has you locked (0: at once).

botplus.on_enemy.start_opts=Escape Start
botplus.on_enemy.start_opts.desc=When an enemy first shoots you.
botplus.on_enemy.start_opts.instant_turn=Instant Turn
botplus.on_enemy.start_opts.instant_turn.desc=Drops the NPC attack on the first shot and turns to the escape direction with the first command.
botplus.on_enemy.start_opts.lock_break=Break Lock
botplus.on_enemy.start_opts.lock_break.desc=Uses EMP at the start of the escape once the enemy's lock is confirmed (also while going to a portal). When off, EMP only follows "EMP While Outrunning".
botplus.on_enemy.remember=Remember Enemy
botplus.on_enemy.remember.desc=A remembered player is avoided when seen; NPCs and locator signals near them are skipped. Off when nothing is selected. Works even with Defense off.
botplus.on_enemy.remember.off=Off
botplus.on_enemy.remember.killer=Destroyed My Ship
botplus.on_enemy.remember.killer.desc=The player who destroyed your ship is remembered.
botplus.on_enemy.remember.attacker=Destroyed My Ship + Attacker
botplus.on_enemy.remember.attacker.desc=Players who attacked (shot) or destroyed your ship are remembered (attackers after they stop firing).
botplus.on_enemy.remember_who.killer=Destroyed Your Ship
botplus.on_enemy.remember_who.killer.desc=The player who destroyed your ship is remembered.
botplus.on_enemy.remember_who.attacker=Attacked Your Ship
botplus.on_enemy.remember_who.attacker.desc=A player who shot you is remembered (after they stop firing).
botplus.on_enemy.remember_min=Remember Time (minutes)
botplus.on_enemy.remember_own_min=Own Company Remember Time (minutes)
botplus.on_enemy.remember_own_min.desc=An own-company attacker is remembered this long (avoided, escaped if approaching). 0: never remembered. With Own Company = Ignore, never remembered.

botplus.rsb.smart=Smart RSB
botplus.rsb.smart.desc=No RSB while the NPC is below 10% HP (normal ammo is enough, no RSB wasted).

botplus.plus.range_restore=Restore Original Ranges
botplus.plus.range_restore.desc=When ticked, NPC table ranges go back to the original values BotPlus keeps; the tick clears itself.
# ---- 2.2.0: attack styles, first hit, Eagle Claw, Ricochet
botplus.combat.style.orbit=Orbit
botplus.combat.style.orbit.desc=Arcs around the NPC in a band just inside the table range. Arc length follows ship speed, turns at the ends without stopping, shifts the arc slowly away from danger, never crosses the NPC's front.
botplus.combat.style.pendulum=Pendulum
botplus.combat.style.pendulum.desc=Dives in and fires, then pulls out beyond the farthest distance the NPC hits; shifts sideways on each dive. Less damage taken, slightly longer kills.
botplus.combat.style.wave=Wave Orbit
botplus.combat.style.wave.desc=Circles in one direction without stopping while the orbit waves: fire in the troughs, outside the NPC's reach on the crests. Less damage without losing speed.
botplus.combat.style.harbor=Harbor
botplus.combat.style.harbor.desc=Like Orbit, but always on the NPC's side facing a jumpable portal, so the portal is close if an enemy comes.
botplus.combat.first_hit=First Hit
botplus.combat.first_hit.desc=How each new NPC is engaged.
botplus.combat.first_hit.normal=Normal
botplus.combat.first_hit.normal.desc=Goes towards the NPC for the first hit, then switches to the style.
botplus.combat.first_hit.eagle=Eagle Dive
botplus.combat.first_hit.eagle.desc=Enters from the range edge, passes straight over the NPC and links into the style on the far side (RSB salvo during the pass if RSB is on).
botplus.combat.first_hit.vortex=Vortex Entry
botplus.combat.first_hit.vortex.desc=Enters the range on a tangent instead of straight: already moving in orbit direction on the first hit, no turn and no overshoot.
botplus.combat.eagle_min_hp=Eagle Dive HP Limit (%)
botplus.combat.eagle_min_hp.desc=Below this ship HP, or with another aggressive NPC next to the target, no Eagle Dive: normal entry.
botplus.combat.orbit=Orbit Settings
botplus.combat.orbit.sweep=Arc Time (s)
botplus.combat.orbit.sweep.desc=One arc pass takes about this long; arc length is computed from ship speed. (Orbit and Harbor)
botplus.combat.orbit.band=Band Margin
botplus.combat.orbit.band.desc=The ship orbits this much inside the table range (value is for 640 range, scaled for others). If damage was proven from beyond range, the arc is at 102% of range.
botplus.combat.pendulum=Pendulum Settings
botplus.combat.pendulum.in_ms=Inside Time (ms)
botplus.combat.pendulum.in_ms.desc=Time spent in range on each dive.
botplus.combat.pendulum.out_ms=Outside Time (ms)
botplus.combat.pendulum.out_ms.desc=Time waiting outside the NPC's reach on each pull-out (~1800 for RSB reload).
botplus.combat.pendulum.zigzag=Zigzag Angle
botplus.combat.pendulum.zigzag.desc=Shifts this many degrees around the NPC on each dive.
botplus.combat.pendulum.finish_hp=Finish HP (%)
botplus.combat.pendulum.finish_hp.desc=Below this NPC HP it stops pulling out and finishes the kill.
botplus.combat.wave=Wave Settings
botplus.combat.wave.period=Wave Time (s)
botplus.combat.wave.period.desc=One trough-crest wave takes about this long (keep near RSB reload).
botplus.combat.wave.finish_hp=Finish HP (%)
botplus.combat.wave.finish_hp.desc=Below this NPC HP the wave flattens and stays in range.
botplus.combat.harbor=Harbor Settings
botplus.combat.harbor.max=Harbor Limit
botplus.combat.harbor.max.desc=If the portal is farther than this from the NPC, Harbor isn't used (orbits normally). The arc sits where the NPC's front and the portal side overlap. Only portals jumpable when escaping count.
botplus.combat.claw=Eagle Claw
botplus.combat.claw.enabled=Eagle Claw
botplus.combat.claw.enabled.desc=With several NPCs of the same type nearby, flags each with a single shot, renews flags before they drop, then kills them one by one.
botplus.combat.claw.count=NPCs To Hold
botplus.combat.claw.count.desc=Max NPCs flagged at once (including the one being killed).
botplus.combat.claw.range=Gather Distance
botplus.combat.claw.range.desc=Only NPCs within this distance are flagged.
botplus.combat.claw.order=NPC Order
botplus.combat.claw.order.desc=Which flagged NPC is killed first. Flag lasts 10 s, renewed 4 s before it drops, an NPC not yet killed is held at most 20 s.
botplus.combat.claw.order.low_hp=Lowest HP
botplus.combat.claw.order.low_hp.desc=Lowest HP first.
botplus.combat.claw.order.rival=Closest To Rival
botplus.combat.claw.order.rival.desc=The one closest to another player first.
botplus.combat.claw.rival_only=Only With Rivals
botplus.combat.claw.rival_only.desc=No flagging if no other player is nearby.
botplus.combat.claw.drop_hp=Release HP (%)
botplus.combat.claw.drop_hp.desc=Below this ship HP only the NPC being killed is kept, other flags are released.
botplus.combat.options.opening_guard=Opening Guard
botplus.combat.options.opening_guard.desc=For the first 5 s on each NPC the arc doesn't shift and the ship stays a bit deeper in range: no overshoot and less damage at the start.
botplus.combat.options.ricochet=Ricochet
botplus.combat.options.ricochet.desc=When the NPC is about to die (under 15% or ~4 s left) the next NPC is picked from a wider area (4500) and the arc moves towards it; switches without a gap.
botplus.combat.options.flee_cut=Prevent Escape
botplus.combat.options.flee_cut.desc=When the NPC nears its flee HP (25% if not learned yet) the ship moves in to 72% of range, so the laser stays in range when the NPC starts fleeing and chasing is short or unnecessary.
# ---- 2.2.0: Attack (PvP), defense additions, Push Protection
botplus.on_enemy.mode.attack=Attack
botplus.on_enemy.mode.attack.desc=Fights back (PvP). Settings are in the PvP Plus plugin; if it is off or attack conditions fail (crowd, low HP, push limit) it escapes to a portal.
botplus.on_enemy.own_mode=When Own Company Attacks
botplus.on_enemy.own_mode.desc=What to do when a player from your own company shoots you. "Action" above applies to other companies.
botplus.on_enemy.own_mode.same=Same As Above
botplus.on_enemy.own_mode.same.desc=The "Action" setting above also applies to your own company.
botplus.on_enemy.own_mode.ignore=Ignore
botplus.on_enemy.own_mode.ignore.desc=Nothing is done: no escape, no chase, no shooting, Defense isn't used either. On Rapid HP Loss still applies.
botplus.on_enemy.own_mode.flee=Only Escape
botplus.on_enemy.own_mode.flee.desc=Even with Attack or Continue selected, outruns an own-company attacker and never fires at them.
botplus.on_enemy.own_mode.defend=Defend Only
botplus.on_enemy.own_mode.defend.desc=No escape, no shooting, keeps on the NPC; Defense works. On Rapid HP Loss still applies.
botplus.on_enemy.own_mode.counter=Fight Back
botplus.on_enemy.own_mode.counter.desc=Shoots back at an own-company player while they shoot you (no chase, dropped after 5 s without fire). Defense works.
botplus.on_enemy.pvp=Attack Settings
botplus.on_enemy.pvp.desc=When Action = Attack.
botplus.on_enemy.pvp.who=Who To Attack
botplus.on_enemy.pvp.who.desc=Which players to attack.
botplus.on_enemy.pvp.who.attackers=Only Shooters
botplus.on_enemy.pvp.who.attackers.desc=Only enemies shooting you.
botplus.on_enemy.pvp.who.list_attackers=Listed Shooters
botplus.on_enemy.pvp.who.list_attackers.desc=Enemies with the List Tag in DarkBot's player list who shoot you.
botplus.on_enemy.pvp.who.list=Listed
botplus.on_enemy.pvp.who.list.desc=Everyone with the List Tag (even if not shooting).
botplus.on_enemy.pvp.who.all=Everyone
botplus.on_enemy.pvp.who.all.desc=Every visible enemy (even if not shooting).
botplus.on_enemy.pvp.tag=List Tag
botplus.on_enemy.pvp.tag.desc=Tag from DarkBot's player list for the Listed options.
botplus.on_enemy.pvp.chase=Chase
botplus.on_enemy.pvp.chase.desc=Chases the enemy if it moves away.
botplus.on_enemy.pvp.chase_sec=Chase Time (s)
botplus.on_enemy.pvp.chase_sec.desc=Gives up if the enemy stays out of range this long.
botplus.on_enemy.pvp.chase_dist=Chase Distance
botplus.on_enemy.pvp.chase_dist.desc=Gives up if the enemy gets farther than this.
botplus.on_enemy.pvp.conditional=Conditional Attack
botplus.on_enemy.pvp.conditional.desc=Only attacks if the enemy has less HP than you, otherwise escapes.
botplus.on_enemy.pvp.retreat_hp=Retreat HP (%)
botplus.on_enemy.pvp.retreat_hp.desc=Below this HP the attack is dropped and it escapes to a portal (no new attack for 30 s).
botplus.on_enemy.pvp.crowd=Escape In Crowd
botplus.on_enemy.pvp.crowd.desc=No attack with 2 or more enemies nearby; escapes.
botplus.pvp.firms=Attack Whom
botplus.pvp.firms.desc=Which company's players are attacked. Own company: only while they shoot you, no chasing; dropped after 5 s without fire.
botplus.on_enemy.pvp.off_map=Chase Off Working Map
botplus.on_enemy.pvp.off_map.desc=When off, the attack isn't continued outside the working map.
botplus.pvp.rsb=Use RSB
botplus.pvp.rsb.desc=While attacking a player (and when NPC Steal shoots a player), RSB is used if the RSB sub-plugin is on and RSB is ready.
botplus.pvp.style=PvP Style
botplus.pvp.style.desc=How the ship moves while attacking a player.
botplus.pvp.style.orbit=Orbit
botplus.pvp.style.orbit.desc=Circles the enemy at about 500 while firing.
botplus.pvp.style.kite=Kite
botplus.pvp.style.kite.desc=Stays at the edge of range: moves out and sideways if the enemy closes in. If we are faster the chasing enemy takes damage but cannot close. Orbit if the enemy is faster.
botplus.pvp.style.mine_trap=Mine Trap
botplus.pvp.style.mine_trap.desc=Runs straight for 2.5 s dropping a slowdown mine (SLM-01) behind, then circles for 3 s firing; the chasing enemy runs over the mine. Orbit if the enemy is faster.
botplus.pvp.options=PvP Options
botplus.pvp.options.retreat_strong=Retreat If Stronger
botplus.pvp.options.retreat_strong.desc=After 3 s of fighting, compares who dies first (HP and HP loss rates). If we would die first the attack is dropped and escape takes over.
botplus.pvp.options.chase_low=Chase Only If Low
botplus.pvp.options.chase_low.desc=The enemy is chased only at 25% HP or below (speed ability used); never otherwise. Replaces the "Chase" setting while enabled.
botplus.push=Push Protection
botplus.push.enabled=Active
botplus.push.enabled.desc=Prevents killing the same player over and over (push) and dying to the same player over and over. Records in logs/botplus-push.txt.
botplus.push.kill_limit=Kill Limit
botplus.push.kill_limit.desc=Same player killed at most this many times within the Window; players at the limit are not attacked.
botplus.push.death_limit=Death Limit
botplus.push.death_limit.desc=After dying this many times to a player, it is not attacked; if it attacks, escape to a portal.
botplus.push.window_h=Window (hours)
botplus.push.window_h.desc=Time window for the limits.
botplus.push.same_clan=Don't Attack Own Clan
botplus.push.same_clan.desc=Never attacks players of your own clan.
botplus.protect.when.enemy_first=Enemy attacks
botplus.protect.when.enemy_first.desc=The moment an enemy first shoots, regardless of HP limit; once per attacking player.
botplus.protect.when.attacking=Attacking an enemy
botplus.protect.when.attacking.desc=While you attack an enemy in Attack (PvP) mode.
botplus.protect.counter=Counter Attack
botplus.protect.counter.desc=Used while an enemy shoots you or while you attack. Rockets are only selected while locked on the enemy (PvP / infect shot); the game's auto rocket must be on.
botplus.protect.firms=Counter Whom
botplus.protect.firms.desc=Which company's attackers get the Counter Attack (infection, rockets, mines, ship ability). If not selected, only escape and EMP. Own company: only while they shoot you (5 s rule).
botplus.firm.enemy_firm=Enemy Company
botplus.firm.enemy_firm.desc=Players from other companies (and clan war).
botplus.firm.own_firm=Own Company
botplus.firm.own_firm.desc=Players from your own company: only while they shoot you; stops if they don't shoot for 5 s or leave (no honor loss).
botplus.protect.counter.dcr_250=Slowing Rocket (DCR-250)
botplus.protect.counter.r_ic3=Freezing Rocket (R-IC3)
botplus.protect.counter.pld_8=Blinding Rocket (PLD-8)
botplus.protect.counter.slm_01=Slowing Mine (SLM-01)
botplus.protect.counter.slm_01.desc=Dropped behind while escaping.
botplus.protect.counter.im_01=Infection Mine (IM-01)
botplus.protect.counter.im_01.desc=Dropped behind while escaping.
botplus.protect.counter.ability=Ship Ability
botplus.protect.counter.ability.desc=Uses the ship ability selected below.
botplus.protect.counter.infect=Infect While Escaping
botplus.protect.counter.infect.desc=At the start of an escape, if the enemy is close (800), fires PIB-100 (infection) for 1.5 s; then fire is stopped with CTRL, the lock moves to a nearby NPC and the escape continues (follows Counter Whom).
botplus.protect.ability=Ship Ability
botplus.protect.ability.desc=Ability used when "Ship Ability" is selected in Against Enemies (e.g. Pusat+ Speed Sap).
botplus.protect.infect=Infect Only
botplus.protect.infect.desc=At the start of an escape, if the enemy is close (800), fires PIB-100 (infection) at it for 1.5 s; then fire is stopped with CTRL, the lock moves to a nearby NPC and the escape continues (follows Counter Whom).
botplus.pvp=PvP Plus
botplus.pvp.enabled=Active
botplus.pvp.enabled.desc=Even if enabled in the plugin list, no attacks while this is off; "Attack" then behaves like Escape.
botplus.on_enemy.remember_min.desc=An enemy-company player is remembered this many minutes. 0: never remembered.
botplus.on_enemy.remember_attack_stay=Don't Flee Remembered When Attacking
botplus.on_enemy.remember_attack_stay.desc=With Action = Attack and PvP Plus on, remembered players are not fled from and NPCs near them are not blocked; PvP answers them. Players at the Push Guard death limit are still fled from.
botplus.on_enemy.plus=Advanced Escape
botplus.on_enemy.plus.rapid=Flee On Fast HP Loss (% / 2 s)
botplus.on_enemy.plus.rapid.desc=If player fire drops HP this much within 2 s, flee to a portal without attacking, whatever the mode (Continue, Attack, Ignore included). 0: off.
botplus.on_enemy.plus.smart=Smart Escape
botplus.on_enemy.plus.smart.desc=Escapes early from strong enemies (also when Attack is selected): if HP drops 15% in 1 s, if you would die within 4 s at this rate, or if HP falls below 1.2x the largest 1-second damage that player has dealt. Until learned the limit is 42%, at least 30% afterwards.
botplus.on_enemy.plus.end_hold=Don't End Escape Early
botplus.on_enemy.plus.end_hold.desc=With HP below 50% and the enemy within 3000 the escape doesn't end and map repair doesn't start (max 60 s).
botplus.on_enemy.plus.crit_portal=Nearest Portal When Critical
botplus.on_enemy.plus.crit_portal.desc=Below Escape HP, cone / race rules are skipped: a portal reached before the enemy, else the nearest.
botplus.on_enemy.plus.widen_cone=Widening Cone
botplus.on_enemy.plus.widen_cone.desc=If no portal fits the escape cone it widens 60° → 90° → 120° before outrunning.
botplus.on_enemy.plus.follow_jump=Jump Only If Followed
botplus.on_enemy.plus.follow_jump.desc=At the portal, if the enemy isn't following (no fire for 3 s, not closing) it waits instead of jumping; jumps if the enemy comes or damage is taken.
botplus.on_enemy.plus.chain=Portal Chain
botplus.on_enemy.plus.chain.desc=After jumping, if the enemy follows, jump straight back; otherwise wait 10 s on the other map and return.
botplus.on_enemy.plus.corner=Corner Guard
botplus.on_enemy.plus.corner.desc=Outrun prefers directions open toward the map center and penalizes ones ending in a corner.
botplus.on_enemy.plus.mine=Mine Behind
botplus.on_enemy.plus.mine.desc=While outrunning, if the enemy is within 2000 and closing, drop a slowing mine (SLM-01) every 10 s.
botplus.on_enemy.plus.save=Save Skills For Escape
botplus.on_enemy.plus.save.desc=With Outrun (EMP while outrunning) or Lock Break on, Defense doesn't spend EMP on the first shot; the escape uses it. Below the HP limit, or against an ignored own-company player, Defense still uses it.
botplus.on_enemy.plus.after=Stay Away After Outrun (s)
botplus.on_enemy.plus.after.desc=NPCs near the outrun enemy are skipped for this many seconds. 0: off.
botplus.on_enemy.plus.repair_portal=Portal Repair With Enemy Near
botplus.on_enemy.plus.repair_portal.desc=While repairing with HP below 50% and an enemy player within 3000, repair at a portal instead of on the map.
botplus.avoid_passive=Don't Avoid Passive NPCs
botplus.avoid_passive.desc=NPCs that don't attack when passed (Boss Kristallon, Boss Lordakium, UberLordakium, Uber Saboteur, Uber Barracuda, Uber Annihilator, all Talons) are not bypassed. Ones shooting / aiming at you are still avoided.
botplus.combat.range.no_hit_min=Shrink Range If No Hit (min %)
botplus.combat.range.no_hit_min.desc=If the NPC takes no damage, before ignoring it the attack distance is shrunk in 10% steps down to this ratio (this target only). If still no hit, ignored for 20 s.
botplus.combat.style.crescent=Half Moon
botplus.combat.style.crescent.desc=No full circle: the ship sweeps a ±60° arc in front of the NPC at 102% of range (never beyond the measured hit distance). Logs show 2.5x less damage in front of the NPC.
botplus.combat.style.boomerang=Boomerang
botplus.combat.style.boomerang.desc=A sideways figure-eight (two loops) in front of the NPC, distance waving between 97% and 105% of range. The ship never stops.
botplus.combat.style.range_lock=Range Lock
botplus.combat.style.range_lock.desc=The ship locks onto a range band (e.g. 101–108%) and never stops; it slides along the band, turns back when damage rises and swings where it's low. Never drops out of range; on "out of range" the band moves in, when hit it moves to the outer edge without ceasing fire.
botplus.combat.style.smart_spot=Smart Spot
botplus.combat.style.smart_spot.desc=Learns the side (or the NPC's front if not learned) and the distance where this NPC type deals the least damage and stays there, slowly swaying ±25° so the ship never stops.
botplus.combat.style.shuttle=Shuttle
botplus.combat.style.shuttle.desc=Moves back and forth on a straight line in front of the NPC (low-damage side). Straight lines instead of an arc mean less speed loss and fewer pauses at turns.
botplus.combat.first_hit.lance=Lance
botplus.combat.first_hit.lance.desc=Goes to the range edge without entering: the first shot is from the edge.
botplus.combat.first_hit.diver=Diver
botplus.combat.first_hit.diver.desc=Dives to 97% of range and hits, pulls out to 110% (measured hit distance), then starts the style.
botplus.combat.first_hit.blind_spot=Blind Spot Entry
botplus.combat.first_hit.blind_spot.desc=Enters from the side with the least damage for this NPC type (else the NPC's front); when close it goes around instead of over the NPC.
botplus.combat.first_hit.brake=Brake Entry
botplus.combat.first_hit.brake.desc=At 1.35x range the target is pulled to the exact edge: the ship stops at the edge instead of overshooting into the dangerous inner band.
botplus.combat.first_hit.hawk=Hawk Pass
botplus.combat.first_hit.hawk.desc=Like Eagle Dive, but passes beside the NPC at 75% of range instead of over it (stays out of the high-damage inner band), then joins the style in the same direction.
botplus.combat.first_hit.intercept=Cut In Front
botplus.combat.first_hit.intercept.desc=Goes to where a moving NPC will be when the ship arrives and enters from its front. Normal entry if the NPC is not moving.
botplus.combat.crescent=Half Moon Settings
botplus.combat.crescent.half=Arc Angle (± degrees)
botplus.combat.crescent.half.desc=The ship sweeps this many degrees left and right in front of the NPC.
botplus.combat.lock=Range Lock Settings
botplus.combat.lock.width=Band Width
botplus.combat.lock.width.desc=Distance band to lock onto (percent of range).
botplus.combat.lock.width.narrow=Narrow (101–104%)
botplus.combat.lock.width.medium=Medium (101–108%)
botplus.combat.lock.width.wide=Wide (98–110%)
botplus.combat.lock.max_out=Max Outer Edge (%)
botplus.combat.lock.max_out.desc=The band's outer edge never exceeds this percent of range nor the measured hit distance. Without a measurement the band stays inside the range edge.
botplus.combat.lock.swing=Swing Width
botplus.combat.lock.swing.desc=The ship sweeps at least this angle around the least-damage area.
botplus.combat.lock.swing.narrow=Narrow (40°)
botplus.combat.lock.swing.medium=Medium (70°)
botplus.combat.lock.swing.wide=Wide (100°)
# ---- 2.7.0 simplified menu
botplus.move_opts.avoid_unlisted=Avoid Unlisted NPCs On Path
botplus.move_opts.avoid_unlisted.desc=When going to an NPC, signal or roam point, unkillable NPCs within 700 of the path up to 1500 ahead are bypassed (max 45° detour). The target doesn't change.
botplus.move_opts.avoid_near_off=No Avoiding Near Target
botplus.move_opts.avoid_near_off.desc=Within 1500 of the target NPC or locator signal, unlisted NPCs aren't bypassed; goes straight.
botplus.move_opts.pass_passive=Don't Avoid Passive NPCs
botplus.move_opts.pass_passive.desc=NPCs that don't attack when passed (Boss Kristallon, Boss Lordakium, Uber NPCs, Talons) aren't bypassed. Those shooting / aiming still are.
botplus.move_opts.speed_ability=Speed Ability On Long Paths
botplus.move_opts.speed_ability.desc=On paths longer than 3000 the ship's speed ability is used when ready. Not pressed again while active.
botplus.move_opts.unstuck=Unstuck
botplus.move_opts.unstuck.desc=If the ship doesn't move for 15 seconds it is forced to move.
botplus.move_opts.short_roam=Short Roam
botplus.move_opts.short_roam.desc=With no NPC, roams at most 2000 away.
botplus.move_opts.smart_roam=Smart Roam
botplus.move_opts.smart_roam.desc=With no NPC the map is split into 3000 cells, the nearest cell not checked in the last 75 s is visited (Combat on). Off: random cell.
botplus.box_opts.wait=Wait For Box
botplus.box_opts.wait.desc=Waits 1 second for the box after an NPC dies.
botplus.box_opts.rival=Collect Away From Rivals
botplus.box_opts.rival.desc=Boxes towards a ship that would arrive first or is following you are skipped.
botplus.box_opts.far_ignore=Ignore Far Boxes
botplus.box_opts.far_ignore.desc=Boxes farther than 3000 from the ship are not collected (no running across the map). Unchecked: every visible box is collected.
botplus.box_opts.way_route=Collect On Route To NPC
botplus.box_opts.way_route.desc=Boxes within 300 of the route to an NPC / signal are collected (no going back).
botplus.box_opts.way_near=Collect Nearby On Way To NPC
botplus.box_opts.way_near.desc=Boxes within collect distance are collected, then continues to the NPC. Both unchecked: no detour for boxes.
botplus.renew_choice=Refresh
botplus.renew_choice.desc=The time comes from DarkBot's refresh setting.
botplus.renew_choice.darkbot=DarkBot Settings
botplus.renew_choice.darkbot.desc=BotPlus doesn't handle refreshing; DarkBot does it by its own settings.
botplus.renew_choice.map=Refresh On Map
botplus.renew_choice.portal=Refresh At Portal
botplus.renew_choice.logout=Logout And Refresh
botplus.on_enemy.rapid_mode=On Rapid HP Loss
botplus.on_enemy.rapid_mode.desc=While a player is shooting you (own company included; group members and PETs excluded), if HP drops 50% in 2 seconds this is done in any mode, without attacking. Takes priority over everything except an ongoing portal escape.
botplus.on_enemy.rapid_mode.off=Off
botplus.on_enemy.rapid_mode.portal=Escape To Portal
botplus.on_enemy.rapid_mode.outrun=Outrun
botplus.on_enemy.rapid_mode.outrun.desc=Runs away from the attacker on the map.
botplus.on_enemy.outrun_opts.faster=Portal If Enemy Is Fast
botplus.on_enemy.outrun_opts.faster.desc=If the enemy reaches 90% of our speed or keeps closing while shooting, it can't be outrun: escapes to a portal.
botplus.on_enemy.portal_opts=Portal Escape Options
botplus.on_enemy.portal_opts.desc=Which portal is picked when escaping and what is done there. Portals with a disabled jump condition ("Never", "While Repairing") are never picked.
botplus.on_enemy.portal_opts.cone=Escape Cone
botplus.on_enemy.portal_opts.cone.desc=Only portals away from the enemy (±60°) are picked.
botplus.on_enemy.portal_opts.widen_cone=Widening Cone
botplus.on_enemy.portal_opts.widen_cone.desc=If no portal is in the cone it widens 60° → 90° → 120°, then Outrun.
botplus.on_enemy.portal_opts.race=Arrival Race
botplus.on_enemy.portal_opts.race.desc=Portals the enemy would reach first are not picked.
botplus.on_enemy.portal_opts.else_outrun=Outrun If No Portal
botplus.on_enemy.portal_opts.else_outrun.desc=If no portal fits these rules, runs away on the map. Off: nearest jumpable portal without cone / race rules.
botplus.on_enemy.portal_opts.switch_portal=Switch Portal
botplus.on_enemy.portal_opts.switch_portal.desc=If the jump fails at the portal, goes to another portal immediately. If all portals are closed, Outrun is used.
botplus.on_enemy.portal_opts.pass_jump=Jump While Passing
botplus.on_enemy.portal_opts.pass_jump.desc=Doesn't stop at the portal: passes over it back and forth, trying to jump each pass (~1 s). If the game says "in combat", leaves the shooting NPC's or player's range and returns when damage stops.
botplus.on_enemy.portal_opts.follow_jump=Jump If Followed
botplus.on_enemy.portal_opts.follow_jump.desc=At the portal, if the enemy isn't following, waits there instead of jumping. Not used on maps where jumping in combat isn't allowed.
botplus.on_enemy.portal_opts.portal_chain=Portal Chain
botplus.on_enemy.portal_opts.portal_chain.desc=If the enemy follows through, jumps back at once; otherwise waits 10 s on the other map and returns.
botplus.on_enemy.portal_opts.repair_portal=Repair At Portal When Enemy Near
botplus.on_enemy.portal_opts.repair_portal.desc=When repairing below 50% HP with an enemy within 3000, repairs at a portal instead of on the map.
botplus.on_enemy.adv_opts=Advanced Escape
botplus.on_enemy.adv_opts.desc=How the escape starts and ends. Outrun distance is 2500 (fixed).
botplus.on_enemy.adv_opts.instant_turn=Instant Turn
botplus.on_enemy.adv_opts.instant_turn.desc=On the first shot the NPC is dropped and the ship turns to the escape direction.
botplus.on_enemy.adv_opts.end_hold=Don't End Escape Early
botplus.on_enemy.adv_opts.end_hold.desc=Below 50% HP with the enemy within 3000 the escape doesn't end (max 60 s).
botplus.on_enemy.adv_opts.chase_hold=Don't End While Chased
botplus.on_enemy.adv_opts.chase_hold.desc=If the enemy closed in during the last 3 s and is within 4000, outrunning doesn't end.
botplus.on_enemy.adv_opts.after_stay=Stay Away After Outrun
botplus.on_enemy.adv_opts.after_stay.desc=NPCs near the outrun enemy are not picked for 30 seconds.
botplus.on_enemy.adv_opts.corner_guard=Corner Guard
botplus.on_enemy.adv_opts.corner_guard.desc=When outrunning, directions open towards the map center are preferred.
botplus.combat.range_opts=Range
botplus.combat.range_opts.desc=Attack distance options.
botplus.combat.range_opts.chase=Chase Fleeing NPC
botplus.combat.range_opts.chase.desc=A fleeing NPC is chased; attack distance drops to 70% of the range.
botplus.combat.range_opts.flee_cut=Close In Before It Flees
botplus.combat.range_opts.flee_cut.desc=Near the NPC's flee HP (25% if not learned) moves to 72% of the range so the laser stays in range when it flees.
botplus.combat.range_opts.no_hit_shrink=Shrink Range If No Hit
botplus.combat.range_opts.no_hit_shrink.desc=If the NPC takes no damage, the attack distance is shrunk in 10% steps down to 60% before ignoring it (this target only).
botplus.protect.counter.late_speed=Speed Ability When Close
botplus.protect.counter.late_speed.desc=When outrunning, the speed ability is used when the enemy gets within 600 and keeps closing, not at the start.
botplus.protect.emp.escape_lock=While Escaping If Still Locked
botplus.protect.emp.escape_lock.desc=When outrunning, if the enemy still has you locked after 2000 of travel (or right before switching to a portal), EMP is used.
botplus.protect.ability_pick=Ship Ability
botplus.protect.ability_pick.desc=Ship ability used as a counter. The list shows the ship's abilities (after the game loads). Off: not used.
botplus.repair.hp_wait=Wait For HP
botplus.repair.hp_wait.desc=Below this HP no new NPC is attacked until HP refills. Not waited if an NPC is shooting you.
botplus.repair.hp_wait.hp=HP Limit (%)
botplus.repair.hp_wait.hp.desc=0: off.
botplus.firm.clan_safe=Don't Attack Clan Members
botplus.firm.clan_safe.desc=Players from your clan are never shot (PvP, counter, rockets / mines / poison), whether Push is on or off.