botplus.plus.hp_wait.hp=Can Sınırı (%)
botplus.plus.hp_wait.mode=Beklerken
botplus.plus.hp_wait.mode.desc=NPC'nin Yanında Bekle: NPC hedefte tutulur, onu görecek mesafede can doldurulur. Dolaşmaya Devam Et: yeni NPC'ye girilmez, dolaşma / bulucu sürer (Combat Tam Kontrol açıkken).
botplus.plus.hp_wait.mode.near=NPC'nin Yanında Bekle
botplus.plus.hp_wait.mode.roam=Dolaşmaya Devam Et

botplus.plus.unstuck=Takılmayı Çöz
botplus.plus.unstuck.desc=Gemi 15 saniye yerinden kıpırdamazsa hareket etmeye zorlanır.

botplus.plus.fast_lock=Hızlı Kilit
botplus.plus.fast_lock.desc=NPC ölünce sıradaki NPC'ye hemen kilit atılır.

botplus.plus.weak_first=Önce Zayıf NPC
botplus.plus.weak_first.desc=Hedefle savaş başlayınca, lazer menzilinde canı hedefin şu anki canının yarısından az olan listedeki NPC önce kesilir, sonra hedefe dönülür. Birden fazlaysa tablo önceliğine bakılır. Kapalıyken hedef bırakılmaz (sadece daha öncelikli NPC için).

botplus.plus.stats=Verim Sayacı
botplus.plus.stats.desc=Ekrana NPC/saat ve kutu/saat yazılır, loga 5 dakikada bir özet düşer.

botplus.plus.speed_ability=Uzun Yolda Hız Yeteneği
botplus.plus.speed_ability.desc=3000'den uzun yolda (bulucu, uzak NPC, dolaşma) geminin hız yeteneği hazırsa kullanılır.

botplus.plus.smart_roam=Akıllı Dolaşma
botplus.plus.smart_roam.desc=NPC yokken harita PET radar menzili büyüklüğünde karelere bölünür, son 75 sn'de bakılmamış en yakın kareye gidilir (Combat açıkken). Kapalıyken rastgele kare.

botplus.plus.radar=PET Radar Menzili
botplus.plus.radar.desc=Bulucunun gördüğü mesafe. Dolaşma noktaları harita kenarına bundan yakın seçilmez (radar kenarı zaten görür); akıllı dolaşmada kare boyu.

botplus.log=Log Aktif
botplus.log.desc=Test için yapılanlar loga yazılır.

botplus.log_level=Log Seviyesi
botplus.log_level.normal=Normal
botplus.log_level.normal.desc=Sadece kararlar ve değişiklikler.
botplus.log_level.detailed=Ayrıntılı
botplus.log_level.detailed.desc=Ek olarak 5 sn'de bir durum satırı: hedef, mesafeler, menzil, en yakın NPC / düşman, kutu, kargo.

botplus.log_file=botplus.log Dosyası
botplus.log_file.desc=Log ve oyun mesajları logs/botplus.log dosyasına yazılır.

botplus.flag.steal=NPC Çal
botplus.flag.steal.short=NÇ
botplus.flag.steal.desc=Başkasının vurduğu bu NPC çalınır (BotPlus).
botplus.flag.wait_ability=Yetenek Bekle
botplus.flag.wait_ability.short=YB
botplus.flag.wait_ability.desc=Gemi yeteneği hazır olana kadar saldırılmaz (BotPlus).
botplus.flag.wait_hp=HP Bekle
botplus.flag.wait_hp.short=HB
botplus.flag.wait_hp.desc=BotPlus → HP Bekle açık ve "HB işaretli" seçiliyken: gemi canı sınıra gelene kadar NPC'ye girilmez. NPC vurursa yine de saldırılır (BotPlus).

botplus.avoid_ahead=Kaçınma İleri Bakış
botplus.avoid_ahead.desc=Sadece rotada bu kadar ilerideki liste dışı NPC'lerin yanından dolaşılır (daha uzaktakiler yaklaşınca).

botplus.avoid_angle=En Büyük Dolanma Açısı (derece)
botplus.avoid_angle.desc=Dolanma noktası hedeften bundan fazla sapmaz; uygun taraf yoksa düz gidilir.

botplus.avoid_aggressive=Sadece Saldırgan NPC'lerden Kaçın
botplus.avoid_aggressive.desc=Sadece sana saldıran / nişan alan ya da NPC tablosunda pasif işaretli olmayan liste dışı NPC'lerin yanından dolaşılır.

botplus.locator.dead_r=Ölen NPC Yeri Yarıçapı
botplus.locator.dead_r.desc=NPC ölünce ölüm yerinin bu kadar yakınındaki bulucu işareti eski işaret sayılır.
botplus.locator.dead_sec=Ölen NPC Yeri Süresi (sn)
botplus.locator.dead_sec.desc=Ölüm yerindeki eski işaret bu kadar yok sayılır. Orada kesilecek NPC görünürse ya da işaret oradan ayrılırsa erken biter.

botplus.empty=Boş Harita Modu
botplus.empty.desc=Bulucu sinyal vermezken (aranan türden canlı NPC yok) kenarlarda dolaşmak yerine harita ortasında dolaşılır; yeni NPC doğunca yol kısa olur. Bulucu Bulunca Git açık olmalı.
botplus.empty.enabled=Açık
botplus.empty.enabled.desc=Bulucu sinyal vermezken harita ortasında dolaşılır.
botplus.empty.sec=Sinyalsiz Süre (sn)
botplus.empty.sec.desc=Bulucu bu kadar süre sinyal vermezse boş harita modu başlar.

botplus.repair.travel_roam=Uzun Yolda Hızlı Formasyon
botplus.repair.travel_roam.desc=Boşta tamirde 3000'den uzun yolda dolaşma konfigürasyonu / formasyonu kullanılır (dururken ve yakında tamir konfigürasyonu).
botplus.repair.desc=Tamir konfigürasyonu ve başlama / bitiş canı DarkBot'un tamir ayarlarından (Genel → Güvenlik → Tamir) alınır.
botplus.repair.idle_set=Boşta Tamir

botplus.combat.fight_min_hp=Yeni Dövüş İçin En Az Can (%)
botplus.combat.fight_min_hp.desc=Can bunun altındayken yeni NPC'ye girilmez, sana ateş eden yoksa (0: kapalı). Başlamış dövüş bu yüzden bırakılmaz.
botplus.combat.full=Tam Kontrol
botplus.combat.full.desc=Açıkken dövüşü BotPlus yönetir (saldırı tarzı, yay, menzil). Kapalıyken dövüşü DarkBot'un mantığı yapar; aşağıdaki hedef ve menzil ayarları ona yardım eder.
botplus.combat.flee=Kaçan NPC
botplus.combat.target=Hedef
botplus.combat.range=Menzil

botplus.pet.combat.combo_guard=Kombo Koruma

botplus.rsb=RSB Cephanesi
botplus.rsb.desc=Tuşsuz BotPlus RSB: cephane listeden seçilir. BotPlus saldırırken DarkBot'un kendi RSB'si engellenir. İlk atış hep normal cephane; RSB'ye geçince ateş durursa hemen normal cephaneye dönülür.
botplus.rsb.enabled=Aktif
botplus.rsb.which=Hangi NPC'ler
botplus.rsb.which.flagged=RSB işaretli NPC'ler
botplus.rsb.which.all=Tüm NPC'ler
botplus.rsb.ammo=RSB Cephanesi
botplus.rsb.ping=Ping Sınırı (ms)
botplus.rsb.ping.desc=Ping bunun üstündeyken RSB kullanılmaz.
botplus.rsb.lag_guard=Gecikme Koruması
botplus.rsb.lag_guard.desc=RSB'ye geçince ateş sürmezse normal cephaneye dönülür; 30 sn'de 2 hata olursa RSB 20 sn kapanır.

botplus.flag.rsb=RSB Kullan (BotPlus)
botplus.flag.rsb.short=RSB
botplus.flag.rsb.desc=Bu NPC'de RSB kullanılır (BotPlus RSB, "RSB işaretli").

botplus.locator.refresh=NPC Patlayınca Düşman Bulucuyu Yenile
botplus.locator.refresh.desc=NPC ölünce PET kısa süre pasife alınıp düşman bulucuya geri döner; ölüm yerindeki eski işaret yerine yeni işaret daha erken gelebilir (deneme). Sadece 4 sn savaş dışında kalınca yapılır.
botplus.locator.go_set=Bulucuya Git
botplus.locator.attacked=Vurulan NPC
botplus.locator.empty=Boş Harita Modu
botplus.locator.empty.desc=Bulucu 6 saniye sinyal vermezse (aranan türden canlı NPC yok) kenarlarda dolaşmak yerine harita ortasında dolaşılır; yeni NPC doğunca yol kısa olur.

botplus.work=Modül Seçimi
botplus.work.desc=DarkBot modülleri gibi kesin kural: Sadece Toplama'da NPC'ye hiç gidilmez, Sadece NPC'de hiç kutu toplanmaz (alt modül ayarları açık olsa bile). DarkBot'un kendi modülü seçiliyse o modül belirler.
botplus.work.npc=Sadece NPC
botplus.work.box=Sadece Toplama
botplus.work.npc_box=NPC + Toplama

botplus.general=Genel

botplus.move=Hareket

botplus.roam=Dolaşma

botplus.box=Kutu

botplus.log_set=Log

botplus.defense.enabled=Aktif
botplus.defense.enabled.desc=Eklenti listesinde açık olsa da bu tik kapalıyken Defense hiçbir şey yapmaz (EMP, Insta-Shield, HP Link). Düşman saldırınca ne yapılacağı ve Düşmanı Hatırla BotPlus menüsündeki "Düşman Saldırınca" grubunda.
botplus.defense.rsb_players=Oyunculara RSB Kullan
botplus.defense.rsb_players.desc=Oyuncuya ateş edilirken (NPC Steal) RSB alt modülü açıksa RSB atılır.

botplus.flag=BotPlus

botplus.on_enemy=Düşman Saldırınca
botplus.on_enemy.desc=Düşman oyuncu sana ateş edince ne yapılsın. Sadece modül olarak BotPlus seçiliyken geçerli; o zaman DarkBot'un "Düşmandan Kaç" ayarları yerine bu kullanılır. DarkBot'un kendi modülü seçiliyken kaçışı DarkBot'un ayarları yapar (Combat, RSB, Defense gibi alt modüller yine çalışır).
botplus.on_enemy.mode=Ne Yapılsın
botplus.on_enemy.mode.continue=Devam Et
botplus.on_enemy.mode.continue.desc=NPC kesmeye devam edilir; can aşağıdaki sınırın altına inerse portala kaçılır.
botplus.on_enemy.mode.escape=Kaç
botplus.on_enemy.mode.escape.desc=En yakın güvenli portala kaçılır, saldırı kesilince geri dönülür. Portal yoksa haritada atlatılır.
botplus.on_enemy.mode.outrun=Hızla Atlat
botplus.on_enemy.mode.outrun.desc=Haritada düşmandan uzaklaşılır (hız yeteneği kullanılır). Düşman daha hızlıysa, yaklaşıyorsa ya da can düşükse portala kaçılır.
botplus.on_enemy.hp=Kaçış Canı (%)
botplus.on_enemy.hp.desc=Düşman ateş ederken can bunun altına inerse (Devam Et dahil) portala kaçılır. 0: can yüzünden kaçılmaz.
botplus.on_enemy.outrun=Hızla Atlat Ayarları
botplus.on_enemy.outrun.dist=Atlatma Uzaklığı
botplus.on_enemy.outrun.dist.desc=Düşmandan bu kadar uzaklaşınca atlatma biter.
botplus.on_enemy.outrun.calm=Sakin Süre (sn)
botplus.on_enemy.outrun.calm.desc=Düşman bu kadar süre ateş etmezse işe dönülür.
botplus.on_enemy.outrun.faster=Düşman Hızlıysa Portala Kaç
botplus.on_enemy.outrun.faster.desc=Düşman gemiden hızlıysa atlatılamaz: doğrudan portala kaçılır.
botplus.on_enemy.outrun.emp=Atlatırken EMP Bas
botplus.on_enemy.outrun.emp.desc=Kaçarken aşağıdaki yol kadar gidildiği halde düşmanın kilidi hâlâ sendeyse EMP basılır, kilidi kırılır ve düşmanın tersine kaçılır. Düşman hızlıysa / yaklaşıyorsa portala geçmeden önce de denenir. Sadece düşmanın kilidine bakılır; kendi kilidin takılı kaldıysa önce bırakılır.
botplus.on_enemy.outrun.emp_dist=EMP İçin Kaçış Yolu
botplus.on_enemy.outrun.emp_dist.desc=Kaçmaya başladıktan sonra bu kadar yol gidilince düşmanın kilidi devam ediyorsa EMP basılır (0: hemen).

botplus.on_enemy.remember=Düşmanı Hatırla
botplus.on_enemy.remember.desc=Hatırlanan oyuncu 2000 içinde görülürse ondan uzaklaşılır, yanındaki NPC'ler ve bulucu sinyali seçilmez. Defense kapalı olsa da çalışır.
botplus.on_enemy.remember.off=Kapalı
botplus.on_enemy.remember.killer=Seni Patlatan
botplus.on_enemy.remember.killer.desc=Seni patlatan oyuncu hatırlanır.
botplus.on_enemy.remember.attacker=Patlatan + Saldıran
botplus.on_enemy.remember.attacker.desc=Seni patlatan ve sana saldıran oyuncu hatırlanır (saldıran, ateşi kestikten sonra).
botplus.on_enemy.remember_min=Hatırlama Süresi (dakika)

botplus.rsb.smart=Akıllı RSB
botplus.rsb.smart.desc=NPC'nin canı %10'un altındayken RSB atılmaz (normal cephane yeter, RSB boşa gitmez).

botplus.plus.range_restore=Asıl Menzillere Dön
botplus.plus.range_restore.desc=İşaretlenince NPC tablosundaki menziller BotPlus'ın sakladığı asıl değerlerine döner; işaret kendiliğinden kalkar.