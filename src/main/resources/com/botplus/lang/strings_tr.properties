botplus.locator.go.desc=Bulucunun gösterdiği NPC'ye hemen gidilir.
botplus.locator.direct=Düşman Bulucuya Direkt Git
botplus.locator.direct.desc=Enemy Locator açıkken bulucunun gösterdiği NPC'ye her zaman gidilir. Bu açıkken yolda kutu alınmaz, başka NPC'ye dönülmez ve geçerken ateş edilmez; sapmadan gidilir.
botplus.locator.drop=NPC'yi Bırak
botplus.locator.drop.desc=Vurulan NPC bırakılıp bulunan NPC'ye gidilir.
botplus.locator.drop_hp=Bırakma Canı (%)
botplus.locator.drop_hp.desc=Vurulan NPC'nin canı bunun altındaysa önce o bitirilir.

botplus.pet=PET
botplus.pet.desc=Genel PET ayarları. Saldırıdaki PET Combat'ta, çalarken PET NPC Steal'de, yoldaki düşman bulucu Enemy Locator'da.
botplus.pet.enabled=PET'i BotPlus Yönetsin
botplus.pet.enabled.desc=Kapalıyken BotPlus PET modülüne hiç dokunmaz, DarkBot'un PET ayarı geçerli olur.
botplus.pet.combat_change=NPC'ye Saldırırken PET'i Değiştir
botplus.pet.combat_change.desc=Kapalıyken NPC'ye saldırırken PET'e dokunulmaz (DarkBot'un PET ayarı).
botplus.pet.combat=Saldırı PET Modülü
botplus.pet.combat.desc=NPC'ye yaklaşınca PET bu modüle geçer. Kesimden sonra yakında NPC yoksa hemen bulucuya geçer.
botplus.pet.combat.looter=Otomatik Toplayıcı
