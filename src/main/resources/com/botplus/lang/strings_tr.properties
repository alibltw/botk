botplus.repair.avoid=Tamirde Kaçın
botplus.repair.avoid.desc=Tamir sırasında uzak durulanlar (NPC 1500, düşman 3000).
botplus.repair.avoid.npc=NPC'lerden uzak dur
botplus.repair.avoid.enemy=Düşmanlardan uzak dur
botplus.repair.enemy_run_mode=Düşmandan Kaçış Konfigürasyonu
botplus.repair.enemy_run_mode.desc=Düşman oyuncudan uzaklaşırken kaçış konfigürasyonu kullanılır.
botplus.repair.near_npc=NPC Bölgesine Yakın Tamir
botplus.repair.near_npc.desc=Tamir noktası, NPC mesafesinin hemen dışında ve NPC'lerin (yoksa bulucu sinyalinin) tarafında seçilir; tamir biter bitmez kesime dönülür.
botplus.repair.pet_ship=Tamirde PET Gemi Tamiri
botplus.repair.pet_ship.desc=Tamirde PET'in Kombo Gemi Tamiri modülü gemiyi tamir eder (bekleme süresindeyse PET tamirine geçilir).
botplus.repair.idle=Hasar Almıyorken Tamir
botplus.repair.idle.desc=Can aşağıdaki sınırın altına inince tamir edilir. Combat alt modülü açıkken gemi durmaz: dolaşmaya ve bulucuya devam ederken tamir konfigürasyonu ve PET Kombo Gemi Tamiri kullanılır, liste dışı NPC'lerden uzak durulur; listedeki NPC görülünce saldırılır. Combat kapalıyken hedef ve sinyal yokken yerinde durup can doldurulur.
botplus.repair.idle_hp=Boşta Tamir Can Sınırı (%)
botplus.repair.idle_hp.desc=Can bunun altındaysa boşta tamir başlar, Tamir Bitiş Canı'na kadar sürer.

