botplus.combat=Combat
botplus.combat.desc=Açıkken çalışma haritasında tam kontrol BotPlus'ta: hedef seçimi (DarkBot'un yanlış NPC kuralları korunur), saldırı, kutu toplama ve dolaşma. Gemi DarkBot'a bırakılmaz. Mesafeler NPC tablosundaki menzilden alınır.
botplus.combat.enabled=Aktif
botplus.combat.enabled.desc=Tam kontrol: doğrudan yaklaşma, yaya teğet giriş, NPC'nin gideceği yeri okuma, ölünce kutu ve durmadan sıradaki NPC.
botplus.combat.style=Saldırı Tarzı
botplus.combat.style.desc=NPC'nin etrafında nasıl hareket edilir. İlk isabet her zaman doğrudan NPC'ye giderek alınır. Her tarzın ayarları kendi grubunda.
botplus.combat.style.arc=Yay
botplus.combat.style.arc.desc=Güvenli tarafta Dönüş Açısı kadar yay; uçlarda yön değişir.
botplus.combat.style.circle=Tam Tur
botplus.combat.style.circle.desc=DarkBot gibi NPC'nin etrafında tam tur (menzil tablodan).
botplus.combat.style.hold=Sabit
botplus.combat.style.hold.desc=Dönmeden menzil içinde durulur (NPC hareket ederse takip edilir).
botplus.combat.style.safe=Güvenli Açı
botplus.combat.style.safe.desc=NPC'nin en az hasar verdiği tarafta durulur (seçili ya da öğrenilen). Öğrenene kadar yay.
botplus.combat.style.outrange=Menzil Dışından Vur
botplus.combat.style.outrange.desc=NPC'nin vurabildiği mesafenin dışında, lazerin yettiği yerde durulur. NPC'nin menzili yetişiyorsa yay.
botplus.combat.pet=NPC'ye Saldırırken PET
botplus.combat.pet.desc=NPC'ye yaklaşınca PET bu modüle geçer. Değiştirme: PET'e dokunulmaz, DarkBot'un PET ayarı geçerli. Tamir, HP Link ve uzaklaşma bundan önce gelir.
