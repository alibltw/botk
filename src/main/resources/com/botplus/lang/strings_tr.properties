botplus.pet.refresh_min=PET Açılmazsa Yenile (dk)
botplus.pet.refresh_min.desc=PET bu kadar dakika açılamazsa (patlamış, takılmış) oyun yenilenir. BotPlus Yenileme açıksa onun şekliyle (Çıkış Yap / Haritada), değilse DarkBot ile. 0: kapalı.

