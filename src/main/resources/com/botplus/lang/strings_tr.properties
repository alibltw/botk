botplus.combat.options=Seçenekler
botplus.combat.options.desc=Tüm saldırı tarzlarında geçerli seçenekler.
botplus.combat.options.inward=Ara Ara İçeri Gir
botplus.combat.options.inward.desc=Her ikinci gidişte NPC'ye doğru biraz içeri (menzilin %10'u). "Menzil dışı" çok geliyorsa açın.
botplus.combat.options.out_on_damage=Hasar Alırken Menzilden Çık
botplus.combat.options.out_on_damage.desc=NPC vururken (can + kalkan %90'ın altında ve saniyede %1,5'ten hızlı düşüyorsa) 7 sn'de bir 1,5 sn NPC'nin vurduğu mesafenin dışına çıkılır, sonra geri girilir. Kalkan da sayılır.
botplus.combat.options.pre_lock=Ön Saldırı
botplus.combat.options.pre_lock.desc=Menzile girmeden kilitlenir ve ateş açılır; lazer yetişince hasar hemen başlar.

botplus.repair=Tamir
botplus.repair.enabled=Aktif
botplus.repair.enabled.desc=Can Tamir Başlama Canı'nın altına inince tamir edilir. Tamir bitene kadar saldırılmaz.
botplus.repair.place=Tamir Yeri
botplus.repair.place.desc=Haritada: BotPlus olduğu yerde tamir eder. Portalda: tamir için portala gidilir (DarkBot'un kaçış sistemi). DarkBot'a Bırak: tamire BotPlus hiç karışmaz.
botplus.repair.place.map=Haritada (BotPlus)
