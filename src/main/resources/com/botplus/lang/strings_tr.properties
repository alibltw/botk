botplus.box_way.nearby=Yakındakileri Al
botplus.box_way.nearby.desc=Toplama mesafesindeki kutular alınır, sonra NPC'ye devam edilir.

botplus.avoid_unlisted=Yolda Listede Olmayan NPC'lerden Kaçın
botplus.avoid_unlisted.desc=NPC'ye, sinyale ya da dolaşma noktasına giderken yolun 700 yakınındaki kesilmeyen NPC'lerin yanından dolaşılır. Hedef değişmez.

botplus.avoid_near=Hedef Yakınsa NPC'den Kaçınma
botplus.avoid_near.desc=Hedef NPC'ye ya da bulucu işaretine 1500 birimden yakınken liste dışı NPC'lerin etrafından dolanılmaz, doğrudan gidilir; saldırı konfigürasyonuna da burada geçilir.

botplus.box_max_dist=Kutu En Fazla Uzaklık
botplus.box_max_dist.desc=Bundan uzaktaki kutulara gidilmez (haritanın öbür ucuna koşulmaz).

botplus.locator=Bulucu
