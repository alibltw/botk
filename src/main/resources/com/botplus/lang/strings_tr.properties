botplus.repair.idle.desc=Can aşağıdaki sınırın altına inince tamir edilir. Combat alt modülü açıkken gemi durmaz: dolaşmaya ve bulucuya devam ederken tamir konfigürasyonu ve PET Kombo Gemi Tamiri kullanılır, liste dışı NPC'lerden uzak durulur; listedeki NPC görülünce saldırılır. Combat kapalıyken hedef ve sinyal yokken yerinde durup can doldurulur.
