botplus.plus.target.desc=En yakın NPC, sıradaki hedef, hızlı kilit ve menzil öğrenme.

botplus.plus.other=Kutu, Dolaşma ve Diğer
botplus.plus.other.desc=Kutu bekleme, rakip, dolaşma, hız yeteneği, takılma, verim sayacı. (Captcha koruması her zaman açık.)

botplus.plus.nearest=En Yakın NPC
botplus.plus.nearest.desc=Aynı öncelikteki NPC'lerden en yakındaki seçilir.

botplus.plus.short_roam=Kısa Dolaşma
botplus.plus.short_roam.desc=NPC yokken en fazla 2000 birim uzağa gidilir.

botplus.plus.box_wait=Kutuyu Bekle
botplus.plus.box_wait.desc=NPC ölünce kutusu için 1 saniye beklenir. Kapalıyken beklenmez, sadece görünen kutu alınır.

botplus.plus.rival=Rakipten Uzak Topla
botplus.plus.rival.desc=Senden önce varacak ya da seni takip eden gemi varsa o yöndeki kutular atlanır.

botplus.plus.next_target=Sıradaki Hedefe Hazırlan
botplus.plus.next_target.desc=NPC'nin canı %10'un altına inince sıradaki NPC'ye doğru kayılır.

