botplus.combat.finish_first.desc=NPC gemiden çok önce ölecekse tamir ertelenir, önce NPC bitirilir. Gemi canı %25'in altına inerse, başka NPC de vuruyorsa ya da yakında düşman varsa ertelenmez.

