botplus.combat.arc_set.desc=Sadece Saldırı Tarzı "Yay" iken.
botplus.combat.arc_angle=Dönüş Açısı (derece)
botplus.combat.arc_angle.desc=Yayın genişliği.
botplus.combat.safe_set=Güvenli Açı Ayarları
botplus.combat.safe_set.desc=Sadece Saldırı Tarzı "Güvenli Açı" iken.
botplus.combat.safe_side=Güvenli Taraf
botplus.combat.safe_side.desc=NPC'nin hangi tarafında durulacak. Otomatik: BotPlus en az hasar alınan tarafı kendisi bulur.
botplus.combat.safe_side.auto=Otomatik
botplus.combat.safe_side.up_right=Sağ Üst
