botplus.combat.safe_learn=En İyi Açıyı Öğren
botplus.combat.safe_learn.desc=Belirgin fark bulununca Güvenli Taraf seçimi öğrenilen tarafa çevrilir (oturum içinde öğrenir).
botplus.combat.safe_lock=Açıyı Değiştirme
botplus.combat.safe_lock.desc=Seçili taraf kilitlenir; ölçüm ve log sürer ama seçim değişmez.
botplus.combat.safe_approach=Yaklaşırken Güvenli Açıdan Gir
botplus.combat.safe_approach.desc=NPC'ye düz değil, güvenli taraftan yaklaşılır; ilk isabetten sonra yer değiştirmek gerekmez.
botplus.combat.safe_exit=Hasar Artarsa Açıdan Çık
botplus.combat.safe_exit.desc=Güvenli tarafta beklenenden çok hasar alınırsa (3 sn) o NPC'de normal yaya geçilir.
botplus.combat.out_set=Menzil Dışından Vur Ayarları
botplus.combat.out_set.desc=Sadece Saldırı Tarzı "Menzil Dışından Vur" iken.
botplus.combat.out_margin=Pay
botplus.combat.out_margin.desc=NPC'nin vurduğu en uzak mesafenin ne kadar dışında durulacağı.
botplus.combat.finish_first=Önce Bitir, Sonra Tamir
botplus.combat.finish_first.desc=NPC gemiden çok önce ölecekse tamir ertelenir, önce NPC bitirilir. Gemi canı %25'in altına inerse, başka NPC de vuruyorsa ya da yakında düşman varsa ertelenmez.

botplus.plus=Ek Özellikler


botplus.plus.target=Hedef ve Menzil
botplus.plus.target.desc=En yakın NPC, sıradaki hedef, hızlı kilit ve menzil öğrenme.

botplus.plus.other=Kutu, Dolaşma ve Diğer
botplus.plus.other.desc=Kutu bekleme, rakip, dolaşma, hız yeteneği, takılma, verim sayacı. (Captcha koruması her zaman açık.)

botplus.plus.nearest=En Yakın NPC
botplus.plus.nearest.desc=Aynı öncelikteki NPC'lerden en yakındaki seçilir.

botplus.plus.short_roam=Kısa Dolaşma
botplus.plus.short_roam.desc=NPC yokken en fazla 2000 birim uzağa gidilir.

botplus.plus.box_wait=Kutuyu Bekle
botplus.plus.box_wait.desc=NPC ölünce kutusu için 1 saniye beklenir. Kapalıyken beklenmez, sadece görünen kutu alınır.

botplus.plus.rival=Rakipten Uzak Topla
botplus.plus.rival.desc=Senden önce varacak ya da seni takip eden gemi varsa o yöndeki kutular atlanır.

botplus.plus.next_target=Sıradaki Hedefe Hazırlan
botplus.plus.next_target.desc=NPC'nin canı %10'un altına inince sıradaki NPC'ye doğru kayılır.

botplus.plus.auto_range=Otomatik Menzil
botplus.plus.auto_range.desc=Gemi tablo menzilinde dururken NPC vuruyorsa menzil artırılır (oyunun "menzil dışı" dediği lazer sınırı aşılmaz). Tablonun asıl değerinin %110'unu geçmez. Asıl değerler BotPlus'ta saklanır; menzil kaymaz, "Asıl Menzillere Dön" ile geri yüklenir. Elle değiştirdiğin değer yeni asıl değer olur.

botplus.plus.range_down=Vuramıyorsa Menzili Düşür
botplus.plus.range_down.desc=NPC'ye 1 dakika hasar verilemezse ya da oyun menzil içindeyken "menzil dışı" derse menzil düşürülür (Otomatik Menzil kapalı olsa da). Tablodaki asıl menzilin %90'ının altına inilmez; asıl değer kaybolmaz.

botplus.plus.no_learn_flee=Kaçan NPC'den Menzil Öğrenme
botplus.plus.no_learn_flee.desc=NPC kaçarken menzil değiştirilmez; kaçış başlayınca isabet sayacı sıfırlanır, bitince 3 sn veri alınmaz.

botplus.plus.hp_wait=HP Bekle
botplus.plus.hp_wait.desc=Gemi canı sınırın altındayken yeni NPC'ye saldırılmaz. Bize vuran NPC olursa beklenmez.
botplus.plus.hp_wait.enabled=Aktif
botplus.plus.hp_wait.which=Hangi NPC'ler
botplus.plus.hp_wait.which.flagged=HB işaretli
botplus.plus.hp_wait.which.all=Tüm NPC'ler
botplus.plus.hp_wait.hp=Can Sınırı (%)
botplus.plus.hp_wait.mode=Beklerken
botplus.plus.hp_wait.mode.desc=NPC'nin Yanında Bekle: NPC hedefte tutulur, onu görecek mesafede can doldurulur. Dolaşmaya Devam Et: yeni NPC'ye girilmez, dolaşma / bulucu sürer (Combat Tam Kontrol açıkken).
botplus.plus.hp_wait.mode.near=NPC'nin Yanında Bekle
botplus.plus.hp_wait.mode.roam=Dolaşmaya Devam Et

botplus.plus.unstuck=Takılmayı Çöz
botplus.plus.unstuck.desc=Gemi 15 saniye yerinden kıpırdamazsa hareket etmeye zorlanır.

botplus.plus.fast_lock=Hızlı Kilit
botplus.plus.fast_lock.desc=NPC ölünce sıradaki NPC'ye hemen kilit atılır.

botplus.plus.weak_first=Önce Zayıf NPC
botplus.plus.weak_first.desc=Hedefle savaş başlayınca, lazer menzilinde canı hedefin şu anki canının yarısından az olan listedeki NPC önce kesilir, sonra hedefe dönülür. Birden fazlaysa tablo önceliğine bakılır. Kapalıyken hedef bırakılmaz (sadece daha öncelikli NPC için).

botplus.plus.stats=Verim Sayacı
botplus.plus.stats.desc=Ekrana NPC/saat ve kutu/saat yazılır, loga 5 dakikada bir özet düşer.

botplus.plus.speed_ability=Uzun Yolda Hız Yeteneği
botplus.plus.speed_ability.desc=3000'den uzun yolda (bulucu, uzak NPC, dolaşma) geminin hız yeteneği hazırsa kullanılır.

botplus.plus.smart_roam=Akıllı Dolaşma
botplus.plus.smart_roam.desc=NPC yokken harita PET radar menzili büyüklüğünde karelere bölünür, son 75 sn'de bakılmamış en yakın kareye gidilir (Combat açıkken). Kapalıyken rastgele kare.

botplus.plus.radar=PET Radar Menzili
botplus.plus.radar.desc=Bulucunun gördüğü mesafe. Dolaşma noktaları harita kenarına bundan yakın seçilmez (radar kenarı zaten görür); akıllı dolaşmada kare boyu.

botplus.log=Log Aktif
botplus.log.desc=Test için yapılanlar loga yazılır.

botplus.log_level=Log Seviyesi
botplus.log_level.normal=Normal
botplus.log_level.normal.desc=Sadece kararlar ve değişiklikler.
botplus.log_level.detailed=Ayrıntılı
botplus.log_level.detailed.desc=Ek olarak 5 sn'de bir durum satırı: hedef, mesafeler, menzil, en yakın NPC / düşman, kutu, kargo.

botplus.log_file=botplus.log Dosyası
botplus.log_file.desc=Log ve oyun mesajları logs/botplus.log dosyasına yazılır.

botplus.flag.steal=NPC Çal
botplus.flag.steal.short=NÇ
botplus.flag.steal.desc=Başkasının vurduğu bu NPC çalınır (BotPlus).
botplus.flag.wait_ability=Yetenek Bekle
botplus.flag.wait_ability.short=YB
botplus.flag.wait_ability.desc=Gemi yeteneği hazır olana kadar saldırılmaz (BotPlus).
botplus.flag.wait_hp=HP Bekle
botplus.flag.wait_hp.short=HB
botplus.flag.wait_hp.desc=Tamir → Can Bekle açık ve "HB işaretli" seçiliyken: gemi canı sınıra gelene kadar NPC'ye girilmez. NPC vurursa yine de saldırılır.

botplus.avoid_ahead=Kaçınma İleri Bakış
botplus.avoid_ahead.desc=Sadece rotada bu kadar ilerideki liste dışı NPC'lerin yanından dolaşılır (daha uzaktakiler yaklaşınca).

botplus.avoid_angle=En Büyük Dolanma Açısı (derece)
botplus.avoid_angle.desc=Dolanma noktası hedeften bundan fazla sapmaz; uygun taraf yoksa düz gidilir.

botplus.avoid_aggressive=Sadece Saldırgan NPC'lerden Kaçın
botplus.avoid_aggressive.desc=Sadece sana saldıran / nişan alan ya da NPC tablosunda pasif işaretli olmayan liste dışı NPC'lerin yanından dolaşılır.

botplus.locator.dead_r=Ölen NPC Yeri Yarıçapı
botplus.locator.dead_r.desc=NPC ölünce ölüm yerinin bu kadar yakınındaki bulucu işareti eski işaret sayılır.
botplus.locator.dead_sec=Ölen NPC Yeri Süresi (sn)
botplus.locator.dead_sec.desc=Ölüm yerindeki eski işaret bu kadar yok sayılır. Orada kesilecek NPC görünürse ya da işaret oradan ayrılırsa erken biter.

botplus.empty=Boş Harita Modu
botplus.empty.desc=Bulucu sinyal vermezken (aranan türden canlı NPC yok) kenarlarda dolaşmak yerine harita ortasında dolaşılır; yeni NPC doğunca yol kısa olur. Enemy Locator açık olmalı.
botplus.empty.enabled=Açık
botplus.empty.enabled.desc=Bulucu sinyal vermezken harita ortasında dolaşılır.
botplus.empty.sec=Sinyalsiz Süre (sn)
botplus.empty.sec.desc=Bulucu bu kadar süre sinyal vermezse boş harita modu başlar.

botplus.repair.travel_roam=Uzun Yolda Hızlı Formasyon
botplus.repair.travel_roam.desc=Boşta tamirde 3000'den uzun yolda dolaşma konfigürasyonu / formasyonu kullanılır (dururken ve yakında tamir konfigürasyonu).
botplus.repair.desc=Tamir konfigürasyonu ve başlama / bitiş canı DarkBot'un tamir ayarlarından (Genel → Güvenlik → Tamir) alınır.
botplus.repair.idle_set=Boşta Tamir

botplus.combat.fight_min_hp=Yeni Dövüş İçin En Az Can (%)
botplus.combat.fight_min_hp.desc=Can bunun altındayken yeni NPC'ye girilmez, sana ateş eden yoksa (0: kapalı). Başlamış dövüş bu yüzden bırakılmaz.
botplus.combat.full=Tam Kontrol
botplus.combat.full.desc=Açıkken dövüşü BotPlus yönetir (saldırı tarzı, yay, menzil). Kapalıyken dövüşü DarkBot'un mantığı yapar; aşağıdaki hedef ve menzil ayarları ona yardım eder.
botplus.combat.flee=Kaçan NPC
botplus.combat.target=Hedef
botplus.combat.range=Menzil

botplus.pet.combat.combo_guard=Kombo Koruma

botplus.rsb=RSB Cephanesi
botplus.rsb.desc=Tuşsuz BotPlus RSB: cephane listeden seçilir. BotPlus saldırırken DarkBot'un kendi RSB'si engellenir. İlk atış hep normal cephane; RSB'ye geçince ateş durursa hemen normal cephaneye dönülür.
botplus.rsb.enabled=Aktif
botplus.rsb.which=Hangi NPC'ler
botplus.rsb.which.flagged=RSB işaretli NPC'ler
botplus.rsb.which.all=Tüm NPC'ler
botplus.rsb.ammo=RSB Cephanesi
botplus.rsb.ping=Ping Sınırı (ms)
botplus.rsb.ping.desc=Ping bunun üstündeyken RSB kullanılmaz.
botplus.rsb.lag_guard=Gecikme Koruması
botplus.rsb.lag_guard.desc=RSB'ye geçince ateş sürmezse normal cephaneye dönülür; 30 sn'de 2 hata olursa RSB 20 sn kapanır.

botplus.flag.rsb=RSB Kullan (BotPlus)
botplus.flag.rsb.short=RSB
botplus.flag.rsb.desc=Bu NPC'de RSB kullanılır (BotPlus RSB, "RSB işaretli").

botplus.locator.refresh=NPC Patlayınca Düşman Bulucuyu Yenile
botplus.locator.refresh.desc=NPC ölünce PET kısa süre pasife alınıp düşman bulucuya geri döner; ölüm yerindeki eski işaret yerine yeni işaret daha erken gelebilir (deneme). Sadece 4 sn savaş dışında kalınca yapılır.
botplus.locator.go_set=Bulucuya Git
botplus.locator.attacked=Vurulan NPC
botplus.locator.empty=Boş Harita Modu
botplus.locator.empty.desc=Bulucu 6 saniye sinyal vermezse (aranan türden canlı NPC yok) kenarlarda dolaşmak yerine harita ortasında dolaşılır; yeni NPC doğunca yol kısa olur.

botplus.work=Modül Seçimi
botplus.work.desc=DarkBot modülleri gibi kesin kural: Sadece Toplama'da NPC'ye hiç gidilmez, Sadece NPC'de hiç kutu toplanmaz (alt modül ayarları açık olsa bile). DarkBot'un kendi modülü seçiliyse o modül belirler.
botplus.work.npc=Sadece NPC
botplus.work.box=Sadece Toplama
botplus.work.npc_box=NPC + Toplama

botplus.general=Genel

botplus.move=Hareket

botplus.roam=Dolaşma

botplus.box=Kutu

botplus.log_set=Log

botplus.defense.enabled=Aktif
botplus.defense.enabled.desc=Eklenti listesinde açık olsa da bu tik kapalıyken Defense hiçbir şey yapmaz (EMP, Insta-Shield, HP Link). Düşman saldırınca ne yapılacağı ve Düşmanı Hatırla BotPlus menüsündeki "Düşman Saldırınca" grubunda.
botplus.defense.rsb_players=Oyunculara RSB Kullan
botplus.defense.rsb_players.desc=Oyuncuya ateş edilirken (NPC Steal) RSB alt modülü açıksa RSB atılır.

botplus.flag=BotPlus

botplus.on_enemy=Düşman Saldırınca
botplus.on_enemy.desc=Düşman oyuncu sana ateş edince ne yapılsın. Sadece modül olarak BotPlus seçiliyken geçerli; o zaman DarkBot'un "Düşmandan Kaç" ayarları yerine bu kullanılır. DarkBot'un kendi modülü seçiliyken kaçışı DarkBot'un ayarları yapar (Combat, RSB, Defense gibi alt modüller yine çalışır).
botplus.on_enemy.mode=Ne Yapılsın
botplus.on_enemy.mode.continue=Devam Et
botplus.on_enemy.mode.continue.desc=NPC kesmeye devam edilir. Can düşünce Tamir (ya da DarkBot'un tamir ayarı) karar verir.
botplus.on_enemy.mode.escape=Kaç
botplus.on_enemy.mode.escape.desc=En yakın güvenli portala kaçılır, saldırı kesilince geri dönülür. Portal yoksa haritada atlatılır.
botplus.on_enemy.mode.outrun=Hızınla Atlat
botplus.on_enemy.mode.outrun.desc=Haritada düşmandan uzaklaşılır (hız yeteneği kullanılır). Düşman daha hızlıysa ya da yaklaşıyorsa (Düşman Hızlıysa Portala Kaç) portala kaçılır.
botplus.on_enemy.hp=Kaçış Canı (%)
botplus.on_enemy.hp.desc=Düşman ateş ederken can bunun altına inerse (Devam Et dahil) portala kaçılır. 0: can yüzünden kaçılmaz. 100: düşman ateş eder etmez kaçılır.
botplus.on_enemy.escape_opts=Kaçış Seçenekleri
botplus.on_enemy.escape_opts.desc=Portala kaçarken hangi portalın seçileceği. Atlama koşulu kapalı ("Asla", "Tamir Esnasında") portal hiçbir zaman seçilmez.
botplus.on_enemy.escape_opts.cone=Kaçış Konisi
botplus.on_enemy.escape_opts.cone.desc=Sadece düşmanın ters yönünde kalan portallar seçilir (±60°). Düşman tarafındaki portala gidilmez.
botplus.on_enemy.escape_opts.race=Varış Yarışı
botplus.on_enemy.escape_opts.race.desc=Düşmanın gemiden önce varacağı portal seçilmez (gemi ve düşman hızları karşılaştırılır).
botplus.on_enemy.escape_opts.switch_portal=Başka Portala Geç
botplus.on_enemy.escape_opts.switch_portal.desc=Portalda atlanamazsa (oyun "kaçamazsın" derse ya da 2,5 sn atlanamazsa) beklenmez, hemen başka portala gidilir. Haritadaki tüm portallar kapalıysa Hızınla Atlat uygulanır.
botplus.on_enemy.escape_opts.pass_jump=Geçerken Atla
botplus.on_enemy.escape_opts.pass_jump.desc=Portalda durup beklenmez: gemi portalın üstünden gidip gelerek geçer, her geçişte (~1 sn) atlama denenir. Oyun "savaş esnasında" derse ateş eden NPC'nin menzilinden çıkılır, hasar kesilince portala dönülür. Düşman ve tamir kaçışında çalışır.
botplus.on_enemy.escape_opts.else_outrun=Portal Yoksa Hızınla Atlat
botplus.on_enemy.escape_opts.else_outrun.desc=Bu kurallara uyan portal yoksa portala zorlanmaz, haritada düşmandan uzaklaşılır. Kapalıyken koni / yarış kuralı olmadan en yakın atlanabilir portala gidilir.
botplus.on_enemy.outrun=Hızınla Atlat Ayarları
botplus.on_enemy.outrun_opts=Hızınla Atlat Seçenekleri
botplus.on_enemy.outrun_opts.desc=Haritada düşmandan uzaklaşırken yön seçimi.
botplus.on_enemy.outrun_opts.reverse=Tam Tersine Kaç
botplus.on_enemy.outrun_opts.reverse.desc=Düşmanın tam tersine (±15°) kaçılır. Yön başta seçilip kilitlenir; sadece düşman ateş ederken yer değiştirirse yenilenir. Kapalıysa alt / üst yana (45–90°) kaçılır; o yan harita kenarına dayanırsa öbür yana geçilir. Düşman tarafı hiç seçilmez.
botplus.on_enemy.outrun_opts.anti_cut=Çapraz Kalkan
botplus.on_enemy.outrun_opts.anti_cut.desc=Düşmanın gemiden önce varabileceği noktalara gidilmez: düşman çapraz keserek kısa yoldan yetişemez.
botplus.on_enemy.outrun_opts.edge_slide=Kenar Boyunca Kay
botplus.on_enemy.outrun_opts.edge_slide.desc=Harita kenarına yaklaşınca durulmaz, kenar boyunca düşmandan uzaklaşan yöne kayılır.
botplus.on_enemy.outrun_opts.emp_turn=EMP Dönüşü
botplus.on_enemy.outrun_opts.emp_turn.desc=Kaçış sırasında EMP basıldıysa (Savunma) düşmanın kilidi kırıldığı an bir kez 70–90° sert dönülür. EMP basılmadıysa denenmez.
botplus.on_enemy.outrun_opts.portal_hop=Kaçarken Portaldan Atla
botplus.on_enemy.outrun_opts.portal_hop.desc=Hızınla Atlat sürerken kaçış yönünde (en fazla 30° sapma) 2500 içinde, düşmandan önce varılan atlanabilir portal varsa yol onun üstünden alınır; durmadan geçerken atlanır. Oyun reddederse (savaş) atlatmaya devam edilir.
botplus.on_enemy.outrun_opts.late_speed=Yaklaşınca Hız Yeteneği
botplus.on_enemy.outrun_opts.late_speed.desc=Hız yeteneği kaçışın başında değil, düşman 600'e girip hâlâ yaklaşıyorsa basılır.
botplus.on_enemy.outrun_opts.side_pass=Sıkışınca Yandan Geç
botplus.on_enemy.outrun_opts.side_pass.desc=Köşe ya da kenarda kaçış yolu kalmazsa (hızımız düşmandan yüksekse) düşmanın yanından en az 1100 mesafeyle geçilip arkasındaki açık alana kaçılır.
botplus.on_enemy.outrun.dist=Atlatma Uzaklığı
botplus.on_enemy.outrun.dist.desc=Düşmandan bu kadar uzaklaşınca atlatma biter.
botplus.on_enemy.outrun.calm=Sakin Süre (sn)
botplus.on_enemy.outrun.calm.desc=Düşman bu kadar süre ateş etmezse işe dönülür.
botplus.on_enemy.outrun.faster=Düşman Hızlıysa Portala Kaç
botplus.on_enemy.outrun.faster.desc=Düşman gemiden hızlıysa atlatılamaz: doğrudan portala kaçılır.
botplus.on_enemy.outrun.emp=Atlatırken EMP Bas
botplus.on_enemy.outrun.emp.desc=Kaçarken aşağıdaki yol kadar gidildiği halde düşmanın kilidi hâlâ sendeyse EMP basılır, kilidi kırılır ve düşmanın tersine kaçılır. Düşman hızlıysa / yaklaşıyorsa portala geçmeden önce de denenir. Sadece düşmanın kilidine bakılır; kendi kilidin takılı kaldıysa önce bırakılır.
botplus.on_enemy.outrun.emp_dist=EMP İçin Kaçış Yolu
botplus.on_enemy.outrun.emp_dist.desc=Kaçmaya başladıktan sonra bu kadar yol gidilince düşmanın kilidi devam ediyorsa EMP basılır (0: hemen).

botplus.on_enemy.start_opts=Kaçış Başlangıcı
botplus.on_enemy.start_opts.desc=Düşman ilk ateş ettiğinde.
botplus.on_enemy.start_opts.instant_turn=Anında Dönüş
botplus.on_enemy.start_opts.instant_turn.desc=İlk atışta NPC saldırısı bırakılır, ilk komutla kaçış yönüne dönülür.
botplus.on_enemy.start_opts.lock_break=Kilit Kır
botplus.on_enemy.start_opts.lock_break.desc=Düşmanın kilidi doğrulanınca kaçışın başında EMP basılır (portala giderken de). Kapalıyken EMP sadece "Atlatırken EMP Bas"a göre basılır.
botplus.on_enemy.remember=Düşmanı Hatırla
botplus.on_enemy.remember.desc=Hatırlanan oyuncu görülürse ondan uzaklaşılır, yanındaki NPC'ler ve bulucu sinyali seçilmez. Hiçbiri seçili değilse kapalı. Defense kapalı olsa da çalışır.
botplus.on_enemy.remember.off=Kapalı
botplus.on_enemy.remember.killer=Gemimi Patlatan
botplus.on_enemy.remember.killer.desc=Gemini patlatan oyuncu hatırlanır.
botplus.on_enemy.remember.attacker=Gemimi Patlatan + Saldıran
botplus.on_enemy.remember.attacker.desc=Gemine saldıran (ateş eden) ve gemini patlatan oyuncu hatırlanır (saldıran, ateşi kestikten sonra).
botplus.on_enemy.remember_who.killer=Gemini Patlatan
botplus.on_enemy.remember_who.killer.desc=Seni patlatan oyuncu hatırlanır.
botplus.on_enemy.remember_who.attacker=Gemine Saldıran
botplus.on_enemy.remember_who.attacker.desc=Sana ateş eden oyuncu hatırlanır (ateşi kestikten sonra).
botplus.on_enemy.remember_min=Hatırlama Süresi (dakika)
botplus.on_enemy.remember_own_min=Kendi Şirketini Hatırlama Süresi (dakika)
botplus.on_enemy.remember_own_min.desc=Kendi şirketinden sana saldıran bu kadar süre hatırlanır (yanına gidilmez, yaklaşırsa kaçılır). 0: hiç hatırlanmaz. Kendi Şirketi = Yok Say ise hiç hatırlanmaz.

botplus.rsb.smart=Akıllı RSB
botplus.rsb.smart.desc=NPC'nin canı %10'un altındayken RSB atılmaz (normal cephane yeter, RSB boşa gitmez).

botplus.plus.range_restore=Asıl Menzillere Dön
botplus.plus.range_restore.desc=İşaretlenince NPC tablosundaki menziller BotPlus'ın sakladığı asıl değerlerine döner; işaret kendiliğinden kalkar.
# ---- 2.2.0: saldiri tarzlari, ilk vurus, Kartal Pencesi, Seken Atis
botplus.combat.style.orbit=Yörünge
botplus.combat.style.orbit.desc=NPC'nin etrafında, tablo menzilinin hemen içindeki bantta yay çizilir. Yay boyu gemi hızına göre, uçlarda durmadan damla dönüş yapılır, tehlike olunca yay ortası yavaşça kayar, NPC'nin önüne girilmez.
botplus.combat.style.pendulum=Sarkaç
botplus.combat.style.pendulum.desc=İçeri dalıp ateş edilir, sonra NPC'nin vurduğu en uzak mesafenin dışına çıkılır; her dalışta biraz yana kayılır. Daha az hasar alınır, kesim biraz uzar.
botplus.combat.style.wave=Dalga Yörüngesi
botplus.combat.style.wave.desc=Durmadan tek yönde dönülür, yörünge dalgalanır: çukurda menzil içinde ateş, tepede NPC'nin menzili dışında. Hız kaybı olmadan daha az hasar.
botplus.combat.style.harbor=Liman
botplus.combat.style.harbor.desc=Yörünge gibi, ama yay hep NPC'nin atlanabilir portala bakan tarafında çizilir: düşman gelirse portal yakında olur.
botplus.combat.first_hit=İlk Vuruş
botplus.combat.first_hit.desc=Her yeni NPC'ye nasıl girilir.
botplus.combat.first_hit.normal=Normal
botplus.combat.first_hit.normal.desc=NPC'ye doğru gidilip ilk vuruş yapılır, sonra tarza geçilir.
botplus.combat.first_hit.eagle=Kartal Dalışı
botplus.combat.first_hit.eagle.desc=Menzil kenarından girilip NPC'nin üstünden düz geçilir, karşı taraftan tarza bağlanılır (RSB açıksa salvo bu geçişte atılır).
botplus.combat.first_hit.vortex=Girdap Girişi
botplus.combat.first_hit.vortex.desc=NPC'ye düz gidilmez, menzile tegetten girilir: ilk vuruşta gemi zaten yörünge yönünde, dönüş ve dışarı savrulma olmaz.
botplus.combat.eagle_min_hp=Kartal Dalışı Can Sınırı (%)
botplus.combat.eagle_min_hp.desc=Gemi canı bunun altındaysa ya da hedefin yanında başka saldırgan NPC varsa Kartal Dalışı yapılmaz, normal girilir.
botplus.combat.orbit=Yörünge Ayarları
botplus.combat.orbit.sweep=Yay Süresi (sn)
botplus.combat.orbit.sweep.desc=Bir yay gidişi yaklaşık bu kadar sürer; yay boyu gemi hızından hesaplanır. (Yörünge ve Liman)
botplus.combat.orbit.band=Bant Payı
botplus.combat.orbit.band.desc=Gemi tablo menzilinin bu kadar içinde döner (değer 640 menzil içindir, başka menzilde orantılı). Menzil üstünden hasar verildiği ölçüldüyse yay menzilin %102'sinde.
botplus.combat.pendulum=Sarkaç Ayarları
botplus.combat.pendulum.in_ms=İç Süre (ms)
botplus.combat.pendulum.in_ms.desc=Her dalışta menzil içinde kalınan süre.
botplus.combat.pendulum.out_ms=Dış Süre (ms)
botplus.combat.pendulum.out_ms.desc=Her çekilişte NPC'nin menzili dışında beklenen süre (RSB dolumu için ~1800).
botplus.combat.pendulum.zigzag=Zikzak Açısı
botplus.combat.pendulum.zigzag.desc=Her dalışta NPC'nin etrafında bu kadar derece yana kayılır.
botplus.combat.pendulum.finish_hp=Bitiriş Canı (%)
botplus.combat.pendulum.finish_hp.desc=NPC canı bunun altına inince dışarı çıkılmaz, kesim bitirilir.
botplus.combat.wave=Dalga Ayarları
botplus.combat.wave.period=Dalga Süresi (sn)
botplus.combat.wave.period.desc=Bir çukur-tepe dalgası yaklaşık bu kadar sürer (RSB dolumuna yakın tutun).
botplus.combat.wave.finish_hp=Bitiriş Canı (%)
botplus.combat.wave.finish_hp.desc=NPC canı bunun altına inince dalga düzleşir, menzil içinde kalınır.
botplus.combat.harbor=Liman Ayarları
botplus.combat.harbor.max=Liman Sınırı
botplus.combat.harbor.max.desc=Portal NPC'ye bundan uzaksa Liman uygulanmaz, Yörünge gibi dönülür. Yay NPC'nin önü ile portal tarafının ortak bölgesine kurulur. Sadece kaçışta atlanabilir portallar sayılır.
botplus.combat.claw=Kartal Pençesi
botplus.combat.claw.enabled=Kartal Pençesi
botplus.combat.claw.enabled.desc=Yakında aynı türden birden fazla NPC varken hepsine tek atışla bayrak alınır, bayrak düşmeden yenilenir, sonra sırayla kesilir.
botplus.combat.claw.count=Tutulacak NPC Sayısı
botplus.combat.claw.count.desc=Aynı anda bayrağı tutulacak en fazla NPC (kesilen dahil).
botplus.combat.claw.range=Toplama Mesafesi
botplus.combat.claw.range.desc=Sadece bu mesafedeki NPC'lerin bayrağı alınır.
botplus.combat.claw.order=NPC Sırası
botplus.combat.claw.order.desc=Bayrağı tutulan NPC'lerden hangisi önce kesilir. Bayrak 10 sn, düşmeden 4 sn önce yenilenir, kesilmeyen NPC en fazla 20 sn tutulur.
botplus.combat.claw.order.low_hp=En Düşük Can
botplus.combat.claw.order.low_hp.desc=Canı en düşük olan önce.
botplus.combat.claw.order.rival=Rakibe En Yakın
botplus.combat.claw.order.rival.desc=Başka oyuncuya en yakın olan önce (rakip almadan).
botplus.combat.claw.rival_only=Sadece Rakip Varken
botplus.combat.claw.rival_only.desc=Yakında başka oyuncu yoksa bayrak alınmaz, normal kesim.
botplus.combat.claw.drop_hp=Bırakma Canı (%)
botplus.combat.claw.drop_hp.desc=Gemi canı bunun altına inerse sadece kesilen NPC tutulur, diğer bayraklar bırakılır.
botplus.combat.options.opening_guard=Açılış Koruması
botplus.combat.options.opening_guard.desc=Her NPC'de ilk 5 sn yay ortası kaymaz ve gemi menzilin biraz daha içinde kalır: ilk saniyelerde dışarı savrulma ve yüksek hasar önlenir.
botplus.combat.options.ricochet=Seken Atış
botplus.combat.options.ricochet.desc=NPC ölmek üzereyken (can %15 altı ya da 4 sn kala) yakındaki sıradaki NPC daha geniş alanda (4500) seçilir, yay ona kayar; ölünce aradaki boşluk olmadan geçilir.
botplus.combat.options.flee_cut=Kaçışı Önle
botplus.combat.options.flee_cut.desc=NPC kaçma canına yaklaşınca (öğrenilmemişse %25) menzilin %72'sine kadar yaklaşılır: NPC kaçmaya başlayınca lazer menzilde kalır, kovalamak gerekmez ya da kısa sürer.
# ---- 2.2.0: Saldir (PvP), Koruma eklentileri, Push Korumasi
botplus.on_enemy.mode.attack=Saldır
botplus.on_enemy.mode.attack.desc=Düşmana karşılık verilir (PvP). Ayarlar PvP Plus alt eklentisinde; o kapalıysa ya da saldırı şartları sağlanmazsa (kalabalık, can düşük, push sınırı) portala kaçılır.
botplus.on_enemy.own_mode=Kendi Şirketi Saldırınca
botplus.on_enemy.own_mode.desc=Kendi şirketinden bir oyuncu ateş edince ne yapılır. Üstteki "Ne Yapılsın" başka şirketten saldırana uygulanır.
botplus.on_enemy.own_mode.same=Aynısını Yap
botplus.on_enemy.own_mode.same.desc=Üstteki "Ne Yapılsın" ayarı kendi şirketi için de geçerli.
botplus.on_enemy.own_mode.ignore=Yok Say
botplus.on_enemy.own_mode.ignore.desc=Hiçbir şey yapılmaz: kaçılmaz, takip edilmez, ateş edilmez, Defense (EMP, Insta-Shield, HP Link) da kullanılmaz. Hızlı Can Kaybında yine geçerli.
botplus.on_enemy.own_mode.flee=Sadece Kaç
botplus.on_enemy.own_mode.flee.desc=Saldır ya da Devam Et seçili olsa da kendi şirketinden saldırandan Hızınla Atlat ile kaçılır, ona ateş edilmez.
botplus.on_enemy.own_mode.defend=Sadece Savunma
botplus.on_enemy.own_mode.defend.desc=Kaçılmaz, ateş edilmez, NPC'ye devam edilir; Defense (EMP, Insta-Shield, HP Link) çalışır. Hızlı Can Kaybında yine geçerli.
botplus.on_enemy.own_mode.counter=Karşılık Ver
botplus.on_enemy.own_mode.counter.desc=Kendi şirketinden sana ateş edene, o ateş ettiği sürece karşılık verilir (kovalanmaz, 5 sn ateş etmezse bırakılır). Defense çalışır.
botplus.on_enemy.pvp=Saldırı Ayarları
botplus.on_enemy.pvp.desc=Ne Yapılsın = Saldır iken.
botplus.on_enemy.pvp.who=Kime Saldırılsın
botplus.on_enemy.pvp.who.desc=Hangi oyunculara saldırılır.
botplus.on_enemy.pvp.who.attackers=Sadece Sıkanlara
botplus.on_enemy.pvp.who.attackers.desc=Sadece sana ateş eden düşmanlara.
botplus.on_enemy.pvp.who.list_attackers=Listedeki Sıkanlara
botplus.on_enemy.pvp.who.list_attackers.desc=DarkBot oyuncu listesinde Liste Etiketi olan ve sana ateş edenlere.
botplus.on_enemy.pvp.who.list=Listedekilere
botplus.on_enemy.pvp.who.list.desc=DarkBot oyuncu listesinde Liste Etiketi olan herkese (ateş etmese de).
botplus.on_enemy.pvp.who.all=Herkese
botplus.on_enemy.pvp.who.all.desc=Görülen tüm düşmanlara (ateş etmese de).
botplus.on_enemy.pvp.tag=Liste Etiketi
botplus.on_enemy.pvp.tag.desc=Listedeki seçenekleri için DarkBot oyuncu listesindeki etiket.
botplus.on_enemy.pvp.chase=Kovala
botplus.on_enemy.pvp.chase.desc=Düşman uzaklaşırsa kovalanır.
botplus.on_enemy.pvp.chase_sec=Kovalama Süresi (sn)
botplus.on_enemy.pvp.chase_sec.desc=Düşman bu kadar süre menzil dışında kalırsa bırakılır.
botplus.on_enemy.pvp.chase_dist=Kovalama Mesafesi
botplus.on_enemy.pvp.chase_dist.desc=Düşman bundan uzaklaşırsa bırakılır.
botplus.on_enemy.pvp.conditional=Şartlı Saldırı
botplus.on_enemy.pvp.conditional.desc=Sadece düşmanın canı seninkinden düşükse saldırılır, yoksa kaçılır.
botplus.on_enemy.pvp.retreat_hp=Geri Çekilme Canı (%)
botplus.on_enemy.pvp.retreat_hp.desc=Can bunun altına inerse saldırı bırakılır ve portala kaçılır (30 sn yeni saldırı yok).
botplus.on_enemy.pvp.crowd=Kalabalıkta Kaç
botplus.on_enemy.pvp.crowd.desc=Yakında 2 veya daha fazla düşman varsa saldırılmaz, kaçılır.
botplus.pvp.firms=Kimlere Saldır
botplus.pvp.firms.desc=Saldırı hangi şirketin oyuncularına yapılır. Kendi şirketi seçiliyse sadece sana ateş ederken saldırılır, kovalanmaz; 5 sn ateş etmezse bırakılır.
botplus.on_enemy.pvp.off_map=Çalışma Haritası Dışına Kovala
botplus.on_enemy.pvp.off_map.desc=Kapalıyken çalışma haritası dışında saldırı sürdürülmez.
botplus.pvp.rsb=RSB Kullan
botplus.pvp.rsb.desc=Oyuncuya saldırırken (ve NPC Çalma'da oyuncuya ateş ederken) RSB alt eklentisi açıksa ve RSB hazırsa RSB atılır.
botplus.pvp.style=PvP Tarzı
botplus.pvp.style.desc=Oyuncuya saldırırken nasıl hareket edilir.
botplus.pvp.style.orbit=Yörünge
botplus.pvp.style.orbit.desc=Düşmanın etrafında 500 civarında dönülerek ateş edilir.
botplus.pvp.style.kite=Kaçarak Vur
botplus.pvp.style.kite.desc=Menzil sınırında kalınır: düşman yaklaşırsa dışarı ve yana kayılır. Biz daha hızlıysak düşman kovalarken hasar yer ama yaklaşamaz. Düşman hızlıysa Yörünge.
botplus.pvp.style.mine_trap=Mayın Tuzağı
botplus.pvp.style.mine_trap.desc=2,5 sn düz uzaklaşılıp arkaya yavaşlatıcı mayın (SLM-01) bırakılır, sonra 3 sn dönülerek ateş edilir; peşimizdeki düşman mayına basar. Düşman hızlıysa Yörünge.
botplus.pvp.options=PvP Seçenekleri
botplus.pvp.options.retreat_strong=Güçlüyse Geri Çekil
botplus.pvp.options.retreat_strong.desc=3 sn'lik dövüşten sonra kimin önce öleceği hesaplanır (can ve can kaybı hızları). Biz önce ölüyorsak saldırı bırakılır, kaçış devreye girer.
botplus.pvp.options.chase_low=Canı Azsa Kovala
botplus.pvp.options.chase_low.desc=Düşman sadece canı %25 ve altındayken kovalanır (hız yeteneği kullanılır); diğer durumlarda kovalanmaz. Açıkken "Kovala" ayarının yerine geçer.
botplus.push=Push Koruması
botplus.push.enabled=Aktif
botplus.push.enabled.desc=Aynı oyuncuyu tekrar tekrar öldürme (push) ve aynı oyuncudan tekrar tekrar ölme önlenir. Kayıtlar logs/botplus-push.txt'de.
botplus.push.kill_limit=Öldürme Sınırı
botplus.push.kill_limit.desc=Aynı oyuncu Süre içinde en fazla bu kadar öldürülür; sınırdaki oyuncuya saldırılmaz.
botplus.push.death_limit=Ölme Sınırı
botplus.push.death_limit.desc=Aynı oyuncudan bu kadar ölündüyse ona saldırılmaz, saldırırsa portala kaçılır.
botplus.push.window_h=Süre (saat)
botplus.push.window_h.desc=Sınırların sayıldığı süre.
botplus.push.same_clan=Aynı Klana Saldırma
botplus.push.same_clan.desc=Aynı klandan oyunculara hiç saldırılmaz.
botplus.protect.when.enemy_first=Düşman saldırınca
botplus.protect.when.enemy_first.desc=Düşman ilk ateş ettiği an, can sınırına bakılmadan; her saldıran oyuncu için bir kez.
botplus.protect.when.attacking=Düşmana saldırınca
botplus.protect.when.attacking.desc=Saldır (PvP) modunda sen düşmana saldırırken.
botplus.protect.counter=Karşı Saldırı
botplus.protect.counter.desc=Düşman sana ateş ederken ya da sen saldırırken kullanılır. Roketler sadece düşmana kilitliyken (PvP / bulaştırma atışı) seçilir, oyunun otomatik roketi açık olmalı.
botplus.protect.firms=Kime Karşı
botplus.protect.firms.desc=Karşı Saldırı (zehir, roket, mayın, gemi yeteneği) hangi şirketten saldırana kullanılır. Seçili değilse sadece kaçılır ve EMP basılır. Kendi şirketi seçiliyse sadece sana ateş ederken (5 sn kuralı).
botplus.firm.enemy_firm=Düşman Şirket
botplus.firm.enemy_firm.desc=Başka şirketten oyuncular (ve klan savaşındakiler).
botplus.firm.own_firm=Kendi Şirketi
botplus.firm.own_firm.desc=Kendi şirketinden oyuncular: sadece sana ateş ederken; 5 sn ateş etmezse ya da kaçarsa ateş kesilir (bayrağı düşünce şeref kaybı olmasın).
botplus.protect.counter.dcr_250=Yavaşlatıcı Roket (DCR-250)
botplus.protect.counter.r_ic3=Dondurucu Roket (R-IC3)
botplus.protect.counter.pld_8=Körleştirici Roket (PLD-8)
botplus.protect.counter.slm_01=Yavaşlatıcı Mayın (SLM-01)
botplus.protect.counter.slm_01.desc=Kaçarken arkaya bırakılır.
botplus.protect.counter.im_01=Hastalık Mayını (IM-01)
botplus.protect.counter.im_01.desc=Kaçarken arkaya bırakılır.
botplus.protect.counter.ability=Gemi Yeteneği
botplus.protect.counter.ability.desc=Aşağıda seçilen gemi yeteneği kullanılır.
botplus.protect.counter.infect=Kaçarken Zehirle
botplus.protect.counter.infect.desc=Kaçışın başında düşman yakınsa (800) ona 1,5 sn PIB-100 (zehir) atılır; sonra ateş CTRL ile kesilir, kilit yakındaki NPC'ye taşınır ve kaçışa devam edilir (Kime Karşı'ya uyar).
botplus.protect.ability=Gemi Yeteneği
botplus.protect.ability.desc=Düşmana Karşı'da "Gemi Yeteneği" seçiliyse kullanılacak yetenek (örneğin Pusat+ Speed Sap).
botplus.protect.infect=Sadece Bulaştır
botplus.protect.infect.desc=Kaçışın başında düşman yakınsa (800) ona 1,5 sn PIB-100 (zehir) atılır; sonra ateş CTRL ile kesilir, kilit yakındaki NPC'ye taşınır ve kaçışa devam edilir (Kimlere Karşılık'a uyar).
botplus.pvp=PvP Plus
botplus.pvp.enabled=Aktif
botplus.pvp.enabled.desc=Eklenti listesinde açık olsa da bu tik kapalıysa saldırılmaz; "Saldır" seçiliyse Kaç uygulanır.
botplus.on_enemy.remember_min.desc=Düşman şirketten hatırlanan oyuncu bu kadar dakika hatırlanır. 0: hiç hatırlanmaz.
botplus.on_enemy.remember_attack_stay=Saldır'da Hatırlanandan Kaçma
botplus.on_enemy.remember_attack_stay.desc=Ne Yapılsın = Saldır ve PvP Plus açıkken hatırlanan oyuncudan kaçılmaz, yanındaki NPC'ler yasaklanmaz; karşılığı PvP verir. Push Koruması'nın ölme sınırındaki oyuncudan yine kaçılır.
botplus.on_enemy.plus=Gelişmiş Kaçış
botplus.on_enemy.plus.rapid=Hızlı Can Kaybında Kaç (% / 2 sn)
botplus.on_enemy.plus.rapid.desc=Oyuncu ateşiyle can 2 saniyede bu kadar düşerse mod ne olursa olsun (Devam Et, Saldır, Yok Say dahil) saldırmadan portala kaçılır. 0: kapalı.
botplus.on_enemy.plus.smart=Akıllı Kaçış
botplus.on_enemy.plus.smart.desc=Güçlü düşmandan erken kaçılır (Saldır seçiliyken de): can 1 sn'de %15 düşerse, bu hızla 4 sn içinde ölünecekse ya da can, o oyuncunun 1 sn'de verdiği en büyük hasarın 1,2 katının altına inerse portala kaçılır. Oyuncunun hasarı öğrenilene kadar sınır %42, öğrenince en az %30.
botplus.on_enemy.plus.end_hold=Kaçışı Erken Bitirme
botplus.on_enemy.plus.end_hold.desc=Can %50'nin altında ve düşman 3000 içindeyse kaçış bitmez, haritada tamire geçilmez (en fazla 60 sn).
botplus.on_enemy.plus.crit_portal=Can Kritikse En Yakın Portal
botplus.on_enemy.plus.crit_portal.desc=Can Kaçış Canı'nın altındaysa koni / yarış kuralı aranmaz: düşmandan önce varılan, yoksa en yakın portal.
botplus.on_enemy.plus.widen_cone=Genişleyen Koni
botplus.on_enemy.plus.widen_cone.desc=Kaçış konisinde portal yoksa koni 60° → 90° → 120° genişletilir, ancak o da yoksa Hızınla Atlat.
botplus.on_enemy.plus.follow_jump=Takip Edilirse Atla
botplus.on_enemy.plus.follow_jump.desc=Portala varınca düşman takip etmiyorsa (son 3 sn ateş etmedi, yaklaşmıyor) atlanmaz, portalda beklenir; düşman gelir ya da hasar alınırsa atlanır.
botplus.on_enemy.plus.chain=Portal Zinciri
botplus.on_enemy.plus.chain.desc=Atladıktan sonra düşman da geçerse hemen geri atlanır; geçmezse diğer haritada 10 sn beklenip dönülür.
botplus.on_enemy.plus.corner=Köşeye Sıkışma Önleme
botplus.on_enemy.plus.corner.desc=Hızınla Atlat yön seçerken harita ortasına açık yön tercih edilir, köşeye giden yön cezalanır.
botplus.on_enemy.plus.mine=Arkaya Mayın
botplus.on_enemy.plus.mine.desc=Hızınla Atlat sürerken düşman 2000 içinde ve yaklaşıyorsa yavaşlatıcı mayın (SLM-01) bırakılır (10 sn'de bir).
botplus.on_enemy.plus.save=Yetenekleri Kaçışa Sakla
botplus.on_enemy.plus.save.desc=Ne Yapılsın = Hızınla Atlat (Atlatırken EMP) ya da Kilit Kır açıkken Defense EMP'yi ilk atışta harcamaz, kaçış kullanır. Can sınırının altında ya da Yok Say'daki kendi şirketine karşı Defense yine basar.
botplus.on_enemy.plus.after=Atlatma Sonrası Uzak Dur (sn)
botplus.on_enemy.plus.after.desc=Atlatılan düşmanın yanındaki NPC'ler bu kadar saniye seçilmez. 0: kapalı.
botplus.on_enemy.plus.repair_portal=Düşman Yakınken Portalda Tamir
botplus.on_enemy.plus.repair_portal.desc=Tamirde can %50'nin altında ve düşman oyuncu 3000 içindeyse haritada değil portalda tamir edilir.
botplus.avoid_passive=Saldırmayan NPC'lerden Kaçınma
botplus.avoid_passive.desc=Yanından geçince saldırmayan NPC'lerin (Boss Kristallon, Boss Lordakium, UberLordakium, Uber Saboteur, Uber Barracuda, Uber Annihilator, bütün Talon'lar) yanından dolaşılmaz. Ateş eden / nişan alan yine kaçınılır.
botplus.combat.range.no_hit_min=Vuramazsa Menzili Kıs (en az %)
botplus.combat.range.no_hit_min.desc=NPC'ye hasar verilemiyorsa yok saymadan önce saldırı mesafesi %10 adımlarla bu orana kadar kısılıp denenir (sadece o hedefte). En altta da vurulamazsa 20 sn yok sayılır.
botplus.combat.style.crescent=Yarım Ay
botplus.combat.style.crescent.desc=Tam tur atılmaz: gemi NPC'nin önünde ±60° yayda gidip gelir, menzilin %102'sinde (ölçülen vuruş mesafesini aşmaz). Loglarda NPC'nin önünde alınan hasar 2,5 kat az.
botplus.combat.style.boomerang=Bumerang
botplus.combat.style.boomerang.desc=NPC'nin önünde yatay sekiz (iki döngü) çizilir, mesafe menzilin %97–%105'i arasında dalgalanır. Gemi hiç durmaz.
botplus.combat.style.range_lock=Menzil Kilidi
botplus.combat.style.range_lock.desc=Gemi menzil bandına kilitlenir (ör. %101–%108), hiç durmaz; bant boyunca kayar, hasar artarsa geri döner, azalırsa orada salınır. Menzil dışına düşmez; "menzil dışı" gelirse bant içeri kayar, hasar alınca ateşi kesmeden dış uca çekilir.
botplus.combat.style.smart_spot=Akıllı Konum
botplus.combat.style.smart_spot.desc=Bu NPC türünden en az hasar alınan taraf (öğrenilmemişse NPC'nin önü) ve en az hasar alınan mesafe öğrenilir, gemi orada durur. Durmaması için o noktanın ±25° etrafında yavaşça gidip gelinir.
botplus.combat.style.shuttle=Mekik
botplus.combat.style.shuttle.desc=NPC'nin önünde (az hasar alınan tarafta) düz bir çizgi üzerinde gidip gelinir. Yay yerine düz gidildiği için dönüşlerde hız kaybı ve duraksama azdır.
botplus.combat.first_hit.lance=Mızrak
botplus.combat.first_hit.lance.desc=Menzil sınırına gidilir, içeri girilmez: ilk atış sınırdan yapılır.
botplus.combat.first_hit.diver=Dalgıç
botplus.combat.first_hit.diver.desc=Menzilin %97'sine dalıp vurulur, hemen %110'a (ölçülen vuruş mesafesine) çıkılır, sonra tarza geçilir.
botplus.combat.first_hit.blind_spot=Kör Nokta Girişi
botplus.combat.first_hit.blind_spot.desc=O NPC türü için en az hasar alınan taraftan (öğrenilmemişse NPC'nin önünden) girilir; yakındaysa NPC'nin üstünden geçilmez, etrafından dolanılır.
botplus.combat.first_hit.brake=Frenli Giriş
botplus.combat.first_hit.brake.desc=Menzilin 1,35 katında nokta tam sınıra çekilir: gemi sınırda durur, tehlikeli iç banda taşmaz.
botplus.combat.first_hit.hawk=Atmaca Geçişi
botplus.combat.first_hit.hawk.desc=Kartal Dalışı gibi geçerek vurulur ama NPC'nin üstünden değil, menzilin %75'i kadar yanından geçilir (en çok hasar alınan iç banda girilmez). Geçişin sonunda aynı yönde tarza bağlanılır.
botplus.combat.first_hit.intercept=Önüne Geç
botplus.combat.first_hit.intercept.desc=Hareket eden NPC'nin şimdiki yerine değil, gemi varınca olacağı yere ve önünden girilir. NPC duruyorsa normal giriş.
botplus.combat.crescent=Yarım Ay Ayarları
botplus.combat.crescent.half=Yay Açısı (± derece)
botplus.combat.crescent.half.desc=Gemi NPC'nin önünde bu kadar derece sağa ve sola gidip gelir.
botplus.combat.lock=Menzil Kilidi Ayarları
botplus.combat.lock.width=Bant Genişliği
botplus.combat.lock.width.desc=Kilitlenilen mesafe bandı (menzilin yüzdesi).
botplus.combat.lock.width.narrow=Dar (%101–104)
botplus.combat.lock.width.medium=Orta (%101–108)
botplus.combat.lock.width.wide=Geniş (%98–110)
botplus.combat.lock.max_out=En Fazla Dış Sınır (%)
botplus.combat.lock.max_out.desc=Bandın dış ucu menzilin bu yüzdesini ve ölçülen vuruş mesafesini aşmaz. Ölçüm yoksa bant menzil sınırının içinde kalır.
botplus.combat.lock.swing=Salınım Genişliği
botplus.combat.lock.swing.desc=Gemi en az hasar alınan bölgenin etrafında en az bu kadar açıyla gidip gelir.
botplus.combat.lock.swing.narrow=Dar (40°)
botplus.combat.lock.swing.medium=Orta (70°)
botplus.combat.lock.swing.wide=Geniş (100°)
# ---- 2.7.0 sade menu
botplus.move_opts.avoid_unlisted=Yoldaki Liste Dışı NPC'den Kaçın
botplus.move_opts.avoid_unlisted.desc=NPC'ye, sinyale ya da dolaşma noktasına giderken rotada 1500 ileride, yolun 700 yakınındaki kesilmeyen NPC'lerin yanından dolaşılır (en fazla 45° sapma). Hedef değişmez.
botplus.move_opts.avoid_near_off=Hedef Yakınsa Kaçınma
botplus.move_opts.avoid_near_off.desc=Hedef NPC'ye ya da bulucu işaretine 1500'den yakınken liste dışı NPC'lerin etrafından dolanılmaz, doğrudan gidilir.
botplus.move_opts.pass_passive=Saldırmayan NPC'lerden Kaçınma
botplus.move_opts.pass_passive.desc=Yanından geçince saldırmayan NPC'lerin (Boss Kristallon, Boss Lordakium, Uber NPC'ler, Talon'lar) yanından dolaşılmaz. Ateş eden / nişan alan yine dolaşılır.
botplus.move_opts.speed_ability=Uzun Yolda Hız Yeteneği
botplus.move_opts.speed_ability.desc=3000'den uzun yolda (bulucu, uzak NPC, dolaşma) geminin hız yeteneği hazırsa kullanılır. Etkisi sürerken yeniden basılmaz.
botplus.move_opts.unstuck=Takılmayı Çöz
botplus.move_opts.unstuck.desc=Gemi 15 saniye yerinden kıpırdamazsa hareket etmeye zorlanır.
botplus.move_opts.short_roam=Kısa Dolaşma
botplus.move_opts.short_roam.desc=NPC yokken en fazla 2000 birim uzağa gidilir.
botplus.move_opts.smart_roam=Akıllı Dolaşma
botplus.move_opts.smart_roam.desc=NPC yokken harita 3000'lik karelere bölünür, son 75 sn'de bakılmamış en yakın kareye gidilir (Combat açıkken). Kapalıyken rastgele kare.
botplus.box_opts.wait=Kutuyu Bekle
botplus.box_opts.wait.desc=NPC ölünce kutusu için 1 saniye beklenir. Kapalıyken beklenmez, sadece görünen kutu alınır.
botplus.box_opts.rival=Rakipten Uzak Topla
botplus.box_opts.rival.desc=Senden önce varacak ya da seni takip eden gemi varsa o yöndeki kutular atlanır.
botplus.box_opts.far_ignore=Uzaktaki Kutuları Yok Say
botplus.box_opts.far_ignore.desc=Gemiden 3000'den uzaktaki kutulara gidilmez (haritanın öbür ucuna koşulmaz). İşaretsizse görülen her kutu toplanır.
botplus.box_opts.way_route=NPC'ye Giderken Yoldakileri Al
botplus.box_opts.way_route.desc=NPC'ye ya da sinyale giderken rotanın 300 yakınındaki kutu alınıp devam edilir (geri dönülmez).
botplus.box_opts.way_near=NPC'ye Giderken Yakındakileri Al
botplus.box_opts.way_near.desc=NPC'ye giderken toplama mesafesindeki kutular alınır, sonra NPC'ye devam edilir. İkisi de işaretsizse yolda kutuya dönülmez.
botplus.renew_choice=Yenileme
botplus.renew_choice.desc=Süre DarkBot'un yenileme ayarından alınır.
botplus.renew_choice.darkbot=DarkBot Ayarları
botplus.renew_choice.darkbot.desc=Yenilemeye BotPlus karışmaz, DarkBot kendi ayarına göre yeniler.
botplus.renew_choice.map=Haritada Yenile
botplus.renew_choice.portal=Portalda Yenile
botplus.renew_choice.logout=Çıkış Yapıp Yenile
botplus.on_enemy.rapid_mode=Hızlı Can Kaybında
botplus.on_enemy.rapid_mode.desc=Sana ateş eden bir oyuncu varken (kendi şirketi dahil; grup üyesi ve PET hariç) can 2 saniyede %50 düşerse mod ne olursa olsun saldırmadan uygulanır. Süren portal kaçışı hariç her şeyden önce gelir.
botplus.on_enemy.rapid_mode.off=Kapalı
botplus.on_enemy.rapid_mode.portal=Porta Kaç
botplus.on_enemy.rapid_mode.outrun=Hızınla Atlat
botplus.on_enemy.rapid_mode.outrun.desc=Saldırandan uzağa, haritada kaçılır.
botplus.on_enemy.outrun_opts.faster=Düşman Hızlıysa Portala Kaç
botplus.on_enemy.outrun_opts.faster.desc=Düşman hızı bizimkinin %90'ına ulaşıyorsa ya da ateş ederek sürekli yaklaşıyorsa atlatılamaz: portala kaçılır.
botplus.on_enemy.portal_opts=Portala Kaçış Ayarları
botplus.on_enemy.portal_opts.desc=Portala kaçarken hangi portalın seçileceği ve portalda ne yapılacağı. Atlama koşulu kapalı ("Asla", "Tamir Esnasında") portal hiçbir zaman seçilmez.
botplus.on_enemy.portal_opts.cone=Kaçış Konisi
botplus.on_enemy.portal_opts.cone.desc=Sadece düşmanın ters yönünde kalan portallar seçilir (±60°). Düşman tarafındaki portala gidilmez.
botplus.on_enemy.portal_opts.widen_cone=Genişleyen Koni
botplus.on_enemy.portal_opts.widen_cone.desc=Kaçış konisinde portal yoksa koni 60° → 90° → 120° genişletilir, ancak o da yoksa Hızınla Atlat.
botplus.on_enemy.portal_opts.race=Varış Yarışı
botplus.on_enemy.portal_opts.race.desc=Düşmanın gemiden önce varacağı portal seçilmez (gemi ve düşman hızları karşılaştırılır).
botplus.on_enemy.portal_opts.else_outrun=Portal Yoksa Hızınla Atlat
botplus.on_enemy.portal_opts.else_outrun.desc=Bu kurallara uyan portal yoksa portala zorlanmaz, haritada düşmandan uzaklaşılır. Kapalıyken koni / yarış kuralı olmadan en yakın atlanabilir portala gidilir.
botplus.on_enemy.portal_opts.switch_portal=Başka Portala Geç
botplus.on_enemy.portal_opts.switch_portal.desc=Portalda atlanamazsa (oyun "kaçamazsın" derse ya da 2,5 sn atlanamazsa) beklenmez, hemen başka portala gidilir. Haritadaki tüm portallar kapalıysa Hızınla Atlat uygulanır.
botplus.on_enemy.portal_opts.pass_jump=Geçerken Atla
botplus.on_enemy.portal_opts.pass_jump.desc=Portalda durup beklenmez: gemi portalın üstünden gidip gelerek geçer, her geçişte (~1 sn) atlama denenir. Oyun "savaş esnasında" derse ateş eden NPC'nin ya da oyuncunun menzilinden çıkılır, hasar kesilince portala dönülür.
botplus.on_enemy.portal_opts.follow_jump=Takip Edilirse Atla
botplus.on_enemy.portal_opts.follow_jump.desc=Portala varınca düşman takip etmiyorsa atlanmaz, portalda beklenir; düşman gelir ya da hasar alınırsa atlanır. Savaşta atlanamayan haritalarda beklenmez.
botplus.on_enemy.portal_opts.portal_chain=Portal Zinciri
botplus.on_enemy.portal_opts.portal_chain.desc=Atladıktan sonra düşman da geçerse hemen geri atlanır; geçmezse diğer haritada 10 sn beklenip dönülür.
botplus.on_enemy.portal_opts.repair_portal=Düşman Yakınken Portalda Tamir
botplus.on_enemy.portal_opts.repair_portal.desc=Tamirde can %50'nin altında ve düşman oyuncu 3000 içindeyse haritada değil portalda tamir edilir.
botplus.on_enemy.adv_opts=Gelişmiş Kaçış
botplus.on_enemy.adv_opts.desc=Kaçışın başlaması ve bitmesi. Atlatma uzaklığı 2500 (sabit).
botplus.on_enemy.adv_opts.instant_turn=Anında Dönüş
botplus.on_enemy.adv_opts.instant_turn.desc=İlk atışta NPC saldırısı bırakılır, ilk komutla kaçış yönüne dönülür.
botplus.on_enemy.adv_opts.end_hold=Kaçışı Erken Bitirme
botplus.on_enemy.adv_opts.end_hold.desc=Can %50'nin altında ve düşman 3000 içindeyse kaçış bitmez, haritada tamire geçilmez (en fazla 60 sn).
botplus.on_enemy.adv_opts.chase_hold=Düşman Peşimizdeyse Bitme
botplus.on_enemy.adv_opts.chase_hold.desc=Düşman son 3 sn'de yaklaştıysa ve 4000'den yakınsa atlatma bitmez (yön sıfırlanıp yeniden başlamasın).
botplus.on_enemy.adv_opts.after_stay=Atlatma Sonrası Uzak Dur
botplus.on_enemy.adv_opts.after_stay.desc=Atlatılan düşmanın yanındaki NPC'ler 30 saniye seçilmez.
botplus.on_enemy.adv_opts.corner_guard=Köşeye Sıkışma Önleme
botplus.on_enemy.adv_opts.corner_guard.desc=Hızınla Atlat yön seçerken harita ortasına açık yön tercih edilir, köşeye giden yön cezalanır.
botplus.combat.range_opts=Menzil
botplus.combat.range_opts.desc=Saldırı mesafesi ayarları.
botplus.combat.range_opts.chase=Kaçan NPC'yi Kovala
botplus.combat.range_opts.chase.desc=NPC kaçmaya başlayınca kovalanır; saldırı mesafesi menzilin %70'ine iner (lazer menzilde kalsın).
botplus.combat.range_opts.flee_cut=Kaçmadan Önce Yaklaş
botplus.combat.range_opts.flee_cut.desc=NPC kaçma canına yaklaşınca (öğrenilmemişse %25) menzilin %72'sine kadar yaklaşılır: NPC kaçmaya başlayınca lazer menzilde kalır, kovalamak gerekmez ya da kısa sürer.
botplus.combat.range_opts.no_hit_shrink=Vuramazsa Menzili Kıs
botplus.combat.range_opts.no_hit_shrink.desc=NPC'ye hasar verilemiyorsa yok saymadan önce saldırı mesafesi %10 adımlarla %60'a kadar kısılıp denenir (sadece o hedefte). En altta da vurulamazsa 20 sn yok sayılır.
botplus.protect.counter.late_speed=Yaklaşınca Hız Yeteneği
botplus.protect.counter.late_speed.desc=Hızınla Atlat'ta hız yeteneği kaçışın başında değil, düşman 600'e girip hâlâ yaklaşıyorsa basılır.
botplus.protect.emp.escape_lock=Kaçarken Kilit Sürüyorsa
botplus.protect.emp.escape_lock.desc=Hızınla Atlat'ta 2000 yol kaçıldığı halde düşmanın kilidi hâlâ sendeyse (ya da portala geçilmek üzereyken) EMP basılır, kilidi kırılır ve düşmanın tersine kaçılır.
botplus.protect.ability_pick=Gemi Yeteneği
botplus.protect.ability_pick.desc=Karşı saldırıda kullanılacak gemi yeteneği. Liste gemideki yeteneklerden oluşur (oyun yüklenince). Kapalı: kullanılmaz.
botplus.repair.hp_wait=Can Bekle
botplus.repair.hp_wait.desc=Gemi canı bu sınırın altındayken yeni NPC'ye saldırılmaz, önce can dolar. Sana ateş eden NPC olursa beklenmez.
botplus.repair.hp_wait.hp=Can Sınırı (%)
botplus.repair.hp_wait.hp.desc=0: kapalı.
botplus.firm.clan_safe=Klan Üyelerine Saldırma
botplus.firm.clan_safe.desc=Aynı klandan oyunculara hiç ateş edilmez (PvP, Karşılık Ver, roket / mayın / zehir). Push açık ya da kapalı olsa da geçerli.