botplus.chase.enabled=Kaçan NPC'yi Kovala
botplus.chase.enabled.desc=NPC kaçınca menzil aşağıdaki oran kadar düşürülür, gemi yandan yaklaşır (en fazla 40 sn).
botplus.chase.drop=Menzil Düşüşü (%)
