botplus.pet.travel_locator=Yolda Düşman Bulucu
botplus.pet.travel_locator.desc=NPC ararken ve bulucu sinyaline giderken PET düşman bulucuda (Enemy Locator açıkken).
botplus.pet.repair=Tamirde PET'i Tamir Et
botplus.pet.repair.desc=Tamir ve HP beklerken PET kendi canını tamir eden modülde (yoksa koruma). Gemiyi tamir etmez; gemi için Repair alt modülünde PET Gemi Tamiri var.
botplus.pet.low_repair=PET Canı Düşünce Tamir Et
botplus.pet.low_repair.desc=Dövüş dışındayken (hedef yok, kimse ateş etmiyor) PET'in canı sınırın altına inerse PET kendi tamir modülüne geçer, %70'e kadar tamir eder. Dövüş başlarsa bırakılır.
botplus.pet.low_hp=PET Can Sınırı (%)
