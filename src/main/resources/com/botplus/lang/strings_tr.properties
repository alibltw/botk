botplus.box_way.ignore=Yok Say
botplus.box_way.ignore.desc=NPC'ye giderken hiçbir kutuya dönülmez; görünen NPC varken "NPC yokken kutu" da çalışmaz.
botplus.box_way.on_route=Yoldakileri Al
